schema: spec-driven

context: |
  This OpenSpec tree belongs to a PDE project, not the PDE platform root.
  Language: ru. Human-readable artifact body must be Russian.
  Keep OpenSpec structural headings, SHALL/MUST keywords, and IDs in English.
  One change folder maps to one future Outcome. Do not create pack.md here.
  Every ADDED requirement heading must start with AC-NNN or NFR-NNN.
  Do not implement product code, run /opsx:apply, or archive until the Outcome is released.
  Pack.json remains the gate source of truth after mapping.

rules:
  proposal:
    - Include problem, users, in-scope, out-of-scope, measurable outcome, and open questions
    - Mark each open question as blocking or non-blocking
    - Do not invent owners, Redmine ids, or metrics that are not in the source documents
  specs:
    - Use ADDED, MODIFIED, or REMOVED Requirements headings
    - Heading format must be Requirement AC-NNN or NFR-NNN plus a Russian title
    - Each requirement needs at least one Scenario with WHEN and THEN
  design:
    - Capture NFR, dependencies, compatibility, and recovery only; no hidden scope
  tasks:
    - Treat tasks as delivery-slice hints for ASE, not as Pack source of truth
