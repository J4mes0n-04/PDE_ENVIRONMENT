<title>AV Control Setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg-canvas:#17181B; --bg-surface:#202226; --bg-raised:#2A2D32; --bg-sunken:#141518;
  --border-subtle:#2A2D31; --border-default:#383B41; --border-strong:#4A4E56;
  --text-value:#F2F3F5; --text-label:#8A8F98; --text-muted:#63676E; --text-disabled:#484B50;
  --accent:#4F8FA6; --accent-hover:#5FA1B9; --accent-pressed:#437B90;
  --ov-hover:rgba(255,255,255,0.06); --ov-pressed:rgba(255,255,255,0.10); --ov-selected:rgba(79,143,166,0.16);
  --good:#4FA876; --stale:#C4A24E; --bad:#D66B63; --unknown:#63676E; --critical:#E8433A;
  --r-sm:2px; --r-md:4px;
  --xxs:2px; --xs:4px; --sm:8px; --md:12px; --lg:16px; --xl:24px; --xxl:32px;
  --c-compact:24px; --c-default:32px; --c-large:40px;
  --sans:'IBM Plex Sans',ui-sans-serif,'Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --elev-1-shadow:0 1px 2px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.08);
  --elev-2-shadow:0 2px 12px rgba(0,0,0,.28);
  --elev-3-shadow:0 0 0 1px rgba(79,143,166,.12), 0 8px 28px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
  --elev-inset:inset 0 1px 2px rgba(0,0,0,.32);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg-canvas);color:var(--text-value);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;}
::selection{background:var(--ov-selected);}
button,input,select,textarea{font-family:inherit;font-size:13px;}
:focus-visible{outline:2px solid var(--border-strong);outline-offset:1px;}
.mono{font-family:var(--mono);}
.muted{color:var(--text-muted);}
.label{color:var(--text-label);font-size:12px;}
.xs{font-size:11px;}

/* ===== shell: полный экран ===== */
#app{display:flex;height:100vh;width:100%;overflow:hidden;}
.sidebar{
  --sb-w:228px;
  --sb-w-collapsed:56px;
  width:var(--sb-w);
  flex:0 0 var(--sb-w);
  min-width:var(--sb-w-collapsed);
  max-width:var(--sb-w);
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
  transition:width .32s cubic-bezier(.4,0,.2,1),flex-basis .32s cubic-bezier(.4,0,.2,1),max-width .32s cubic-bezier(.4,0,.2,1);
  z-index:2;
}
/* Стеклянная боковая панель */
.sidebar-glass{
  --sidebar-glass-blur:22px;
  --sidebar-glass-density:0.65;
  box-sizing:border-box;
  color:#eef1f5;
  background-color:#1b2129;
  background-image:linear-gradient(
    115deg,
    rgb(255 255 255 / 0.045) 0%,
    rgb(255 255 255 / 0.015) 40%,
    transparent 75%
  );
  border-right:1px solid rgb(190 215 230 / 0.12);
  box-shadow:
    10px 0 32px rgb(0 0 0 / 0.18),
    inset -1px 0 0 rgb(255 255 255 / 0.035);
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .sidebar-glass{
    background-color:rgb(19 25 32 / var(--sidebar-glass-density));
    -webkit-backdrop-filter:blur(var(--sidebar-glass-blur)) saturate(110%);
    backdrop-filter:blur(var(--sidebar-glass-blur)) saturate(110%);
  }
}
@media (prefers-reduced-transparency:reduce){
  .sidebar-glass{
    background-color:#1b2129;
    background-image:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
}
.sidebar.collapsed{width:var(--sb-w-collapsed);flex-basis:var(--sb-w-collapsed);max-width:var(--sb-w-collapsed);}
.sb-top{padding:var(--md);display:flex;align-items:center;gap:var(--sm);border-bottom:1px solid var(--border-subtle);}
.sb-brand{display:flex;align-items:center;min-width:0;flex:1 1 auto;text-decoration:none;color:inherit;background:transparent;}
.sb-brand-logo{display:block;height:28px;width:auto;max-width:100%;object-fit:contain;object-position:left center;background:transparent;border:none;}
.sidebar.collapsed .sb-brand{flex:0 0 28px;width:28px;overflow:hidden;}
.sidebar.collapsed .sb-brand-logo{height:26px;max-width:none;}
.sb-ctx{padding:var(--sm) var(--md);border-bottom:1px solid var(--border-subtle);display:flex;gap:var(--sm);align-items:center;}
.sb-ctx .dotwrap{width:24px;flex:0 0 auto;display:flex;justify-content:center;}
.sb-ctx-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-ctx-1{font-size:12px;} .sb-ctx-2{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.nav{flex:1;overflow-y:auto;padding:var(--sm) 0;}
.nav-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:var(--sm) var(--md) var(--xs);}
.nav-item{display:flex;align-items:center;gap:var(--sm);height:var(--c-compact);padding:0 var(--md);color:var(--text-label);cursor:pointer;white-space:nowrap;overflow:hidden;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--ov-hover);color:var(--text-value);}
.nav-item:active{background:var(--ov-pressed);}
.nav-item.selected{background:var(--ov-selected);color:var(--text-value);}
.nav-ico{width:16px;flex:0 0 auto;text-align:center;font-size:12px;}
.sidebar .nav-text,.sidebar .sb-ctx-text,.sidebar .nav-group{
  overflow:hidden;white-space:nowrap;opacity:1;max-width:12rem;
  transition:opacity .2s ease .06s,max-width .32s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed .nav-text,.sidebar.collapsed .sb-ctx-text,.sidebar.collapsed .nav-group{
  opacity:0;max-width:0;pointer-events:none;transition:opacity .14s ease,max-width .32s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed .sb-top,.sidebar.collapsed .sb-ctx{justify-content:center;padding-left:0;padding-right:0;}
.sidebar.collapsed .nav-item{justify-content:center;padding-left:0;padding-right:0;gap:0;}
.sb-bottom{border-top:1px solid var(--border-subtle);padding:var(--sm) 0;}
.main{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column;background:#14181e;}
.scroller{
  display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;
  position:relative;
}
/* Главный фон окна · ambient glass */
.ambient-glass{
  --ambient-base:#14181e;
  --ambient-intensity:0.55;
  --ambient-speed:36s;
  --ambient-blur:18px;
  --ambient-glass-density:0.4;
  isolation:isolate;
  overflow:hidden;
  background:var(--ambient-base);
  color:var(--text-value);
}
.ambient-glass::before,
.ambient-glass::after{
  content:"";
  position:absolute;
  pointer-events:none;
}
.ambient-glass::before{
  z-index:-2;
  inset:-12%;
  background:
    linear-gradient(125deg,transparent 24%,rgb(85 185 190 / 0.06) 25%,rgb(85 185 190 / 0.55) 25.4%,rgb(85 185 190 / 0.06) 25.8%,transparent 27%),
    linear-gradient(65deg,transparent 73%,rgb(108 139 200 / 0.06) 74%,rgb(108 139 200 / 0.45) 74.4%,rgb(108 139 200 / 0.06) 74.8%,transparent 76%),
    linear-gradient(165deg,transparent 81%,rgb(115 164 179 / 0.04) 82%,rgb(115 164 179 / 0.3) 82.3%,rgb(115 164 179 / 0.04) 82.6%,transparent 84%);
  opacity:var(--ambient-intensity);
  filter:blur(6px);
  animation:ambient-glass-drift var(--ambient-speed) ease-in-out -12s infinite alternate;
}
.ambient-glass::after{
  z-index:-1;
  inset:0;
  border-radius:inherit;
  background:
    radial-gradient(ellipse at 50% 0%,rgb(190 210 225 / 0.045),transparent 65%),
    radial-gradient(ellipse at 50% 45%,transparent 35%,rgb(5 8 12 / 0.35) 100%),
    rgb(20 24 30 / var(--ambient-glass-density));
  -webkit-backdrop-filter:blur(var(--ambient-blur)) saturate(110%);
  backdrop-filter:blur(var(--ambient-blur)) saturate(110%);
}
@keyframes ambient-glass-drift{
  from{transform:translate3d(-1.5%,-1%,0) rotate(-1deg);}
  to{transform:translate3d(1.5%,1%,0) rotate(1deg);}
}
@media (prefers-reduced-motion:reduce){
  .ambient-glass::before{animation:none;transform:none;}
}
@media (prefers-reduced-transparency:reduce){
  .ambient-glass::after{
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    background:var(--ambient-base);
  }
  .ambient-glass::before{opacity:0.25;}
}
.scroller.ambient-glass>.screen{position:relative;z-index:0;}
.scroller.scene-hero .screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 58% 48% at 50% 56%,rgba(255,255,255,.04) 0%,transparent 68%);
}
.scroller.scene-hero .screen::after{
  content:"";position:absolute;left:50%;top:48%;width:min(560px,92%);height:min(420px,70%);transform:translate(-50%,-50%);
  pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 72% 68% at 50% 50%,rgba(79,143,166,.14) 0%,rgba(79,143,166,.04) 42%,transparent 72%);
}
.scroller.scene-hero .screen>*{position:relative;z-index:1;}
.scroller::-webkit-scrollbar{width:0;height:0;display:none;}
.screen{position:relative;display:flex;flex-direction:column;flex:1 0 auto;width:100%;min-height:100%;box-sizing:border-box;padding-block:var(--xl);padding-left:var(--xl);padding-right:var(--xl);}
.screen>.refs{margin-top:auto;padding-top:var(--md);justify-content:center;width:100%;margin-left:auto;margin-right:auto;}
@media (max-width:520px){.screen{padding-left:var(--lg);padding-right:var(--lg);}}
.readable{max-width:980px;}
.screen:has(.app-shell){align-items:center;}
.app-shell{
  width:100%;max-width:1194px;margin-inline:auto;flex:1 1 auto;min-height:100%;
  display:flex;flex-direction:column;align-items:stretch;box-sizing:border-box;
}
.app-stage{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;width:100%;min-height:0;
  box-sizing:border-box;
}
.app-shell>.refs{flex-shrink:0;margin-top:0;padding-top:var(--md);}
.app-shell .tiles{width:100%;}
.kits-layout{display:flex;flex-direction:column;gap:var(--xl);align-items:stretch;width:100%;}
.sys-link-status{display:flex;gap:var(--sm);align-items:center;margin-bottom:var(--md);}
.sys-link-status--head{margin-bottom:0;text-align:right;flex:0 0 auto;max-width:min(100%,22rem);}
.pagehead .sys-link-status--head{align-self:center;}

/* ===== type ===== */
h1{font-size:16px;font-weight:500;margin:0 0 var(--xs);text-wrap:balance;}
h2{font-size:14px;font-weight:500;margin:0 0 var(--sm);}
h3{font-size:13px;font-weight:500;margin:0;}
p{margin:0 0 var(--md);color:var(--text-label);max-width:64ch;}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--xs);}
.crumb{font-size:11px;color:var(--text-muted);margin-bottom:var(--sm);}
.crumb b{color:var(--text-label);font-weight:400;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--md);flex-wrap:wrap;margin-bottom:var(--xl);}

/* ===== controls ===== */
.btn{height:var(--c-default);padding:0 var(--lg);border:1px solid var(--border-default);border-radius:var(--r-sm);background:var(--bg-raised);color:var(--text-value);cursor:pointer;display:inline-flex;align-items:center;gap:var(--sm);white-space:nowrap;}
.btn:hover{background:var(--ov-hover);} .btn:active{background:var(--ov-pressed);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0E1A1F;font-weight:500;box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 2px 10px rgba(0,0,0,.22);}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn.primary:active{background:var(--accent-pressed);border-color:var(--accent-pressed);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 1px 4px rgba(0,0,0,.2);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-label);}
.btn.ghost:hover{background:var(--ov-hover);color:var(--text-value);}
.btn.large{height:var(--c-large);}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border-default));}
.btn[disabled]{color:var(--text-disabled);background:var(--bg-surface);border-color:var(--border-subtle);cursor:not-allowed;}
.btn[disabled]:hover{background:var(--bg-surface);}
.btnrow{display:flex;gap:var(--sm);flex-wrap:wrap;margin-top:var(--xl);align-items:flex-start;}
.btnrow-stack{display:flex;flex-direction:column;align-items:stretch;gap:var(--sm);min-width:min(100%,280px);flex:0 1 auto;}
.btnrow-stack .btn{justify-content:center;width:100%;}
.btnrow-stack--center{margin-top:var(--md);margin-inline:auto;width:100%;max-width:280px;}
.btnrow-nav{margin-top:var(--lg);}
.btnrow-center{justify-content:center;align-items:center;}
.btnrow-center .btn{min-width:180px;justify-content:center;}
.tb{display:flex;align-items:center;gap:var(--xs);flex-wrap:wrap;}
.tb-btn{height:var(--c-compact);min-width:var(--c-compact);padding:0 var(--sm);border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--text-label);display:inline-flex;align-items:center;gap:var(--xs);cursor:pointer;font-size:12px;}
.tb-btn:hover{background:var(--ov-hover);color:var(--text-value);}
.tb-btn:active{background:var(--ov-pressed);}
.tb-btn.on{background:var(--ov-selected);color:var(--text-value);}
.tb-btn[disabled]{color:var(--text-disabled);cursor:not-allowed;background:none;}
.tb-sep{width:1px;height:16px;background:var(--border-subtle);margin:0 var(--xs);}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px;}
.linkbtn:hover{color:var(--accent-hover);}

/* ===== fields ===== */
.field{margin-bottom:var(--lg);max-width:420px;}
.field>label{display:block;color:var(--text-label);font-size:12px;margin-bottom:var(--xs);}
.hint{font-size:11px;color:var(--text-muted);margin-top:var(--xxs);}
.err{font-size:11px;color:var(--bad);margin-top:var(--xxs);}
.input{width:100%;height:var(--c-default);background:var(--bg-sunken);border:1px solid var(--border-default);border-radius:var(--r-sm);color:var(--text-value);padding:0 var(--md);box-shadow:var(--elev-inset);}
.input:focus{outline:none;border-color:var(--border-strong);}
.input::placeholder{color:var(--text-muted);}
.input.sm{height:var(--c-compact);padding:0 var(--sm);font-size:12px;}
textarea.input{height:auto;padding:var(--sm) var(--md);resize:vertical;line-height:1.5;}
select.input{appearance:none;padding-right:var(--xl);}
.selwrap{position:relative;}
.selwrap::after{content:"▾";position:absolute;right:var(--sm);top:50%;transform:translateY(-50%);color:var(--text-label);font-size:10px;pointer-events:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--lg);max-width:560px;}
@media (max-width:560px){.grid2{grid-template-columns:1fr;}}
.checkrow{display:flex;align-items:center;gap:var(--sm);min-height:var(--c-default);color:var(--text-value);}
.checkrow input{width:15px;height:15px;accent-color:var(--accent);flex:0 0 auto;}
.checkrow label{cursor:pointer;}
.radiocard{display:flex;gap:var(--sm);align-items:flex-start;border:1px solid var(--border-default);border-radius:var(--r-md);padding:var(--md);cursor:pointer;background:var(--bg-surface);margin-bottom:var(--sm);max-width:620px;}
.radiocard:hover{background:var(--ov-hover);}
.radiocard.on{background:var(--ov-selected);border-color:var(--accent);}
.radiocard input{margin-top:3px;accent-color:var(--accent);}
.radiocard .t{font-size:13px;} .radiocard .d{font-size:11px;color:var(--text-muted);margin-top:var(--xxs);}

/* ===== surfaces ===== */
.panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-md);box-shadow:var(--elev-1-shadow);}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--md);padding:var(--sm) var(--lg);border-bottom:1px solid var(--border-subtle);min-height:40px;}
.panel-body{padding:var(--lg);}
.rows .row{display:flex;align-items:center;gap:var(--md);min-height:36px;padding:var(--xs) var(--lg);border-bottom:1px solid var(--border-subtle);}
.rows .row:last-child{border-bottom:none;}
.rows .row:hover{background:var(--ov-hover);}
.rows .row.selected{background:var(--ov-selected);}
.rows.tight .row{padding:var(--xs) var(--md);min-height:var(--c-default);}
.row-main{flex:1;min-width:0;}
.row-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-rows .row .row-main{margin-left:auto;text-align:right;flex:1 1 auto;}
.row-sub{font-size:11px;color:var(--text-muted);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--xs) var(--md);font-size:12px;}
.kv .k{color:var(--text-label);} .kv .v{font-family:var(--mono);font-size:12px;}
.divider{height:1px;background:var(--border-subtle);margin:var(--xl) 0;}
.callout{display:flex;gap:var(--sm);align-items:flex-start;border:1px solid var(--border-default);border-left-width:2px;background:var(--bg-surface);border-radius:var(--r-md);padding:var(--md) var(--lg);font-size:12px;color:var(--text-label);max-width:80ch;}
.callout .ico{flex:0 0 auto;}
.callout.good{border-left-color:var(--good);} .callout.good .ico{color:var(--good);}
.callout.warn{border-left-color:var(--stale);} .callout.warn .ico{color:var(--stale);}
.callout.bad{border-left-color:var(--bad);} .callout.bad .ico{color:var(--bad);}
.callout.info{border-left-color:var(--accent);} .callout.info .ico{color:var(--accent);}
.callout b{color:var(--text-value);font-weight:500;}
.tiles{display:flex;gap:var(--md);flex-wrap:wrap;}
.tile{flex:1;min-width:150px;padding:var(--md) var(--lg);}
.tile.glass{--glass-radius:var(--r-md);}
.tile .n{font-size:22px;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:var(--xxs);}
/* Стеклянная поверхность (дашборд · tiles) */
.glass{
  --glass-blur:20px;
  --glass-opacity:0.58;
  --glass-radius:14px;
  box-sizing:border-box;
  border-radius:var(--glass-radius);
  color:var(--text-value);
  background-color:#25292e;
  background-image:linear-gradient(135deg,rgb(255 255 255 / 0.08) 0%,rgb(255 255 255 / 0.02) 45%,rgb(255 255 255 / 0) 100%);
  background-clip:padding-box;
  border:1px solid rgb(255 255 255 / 0.10);
  border-top-color:rgb(255 255 255 / 0.22);
  border-left-color:rgb(255 255 255 / 0.15);
  box-shadow:
    0 16px 40px rgb(0 0 0 / 0.28),
    0 4px 12px rgb(0 0 0 / 0.16),
    inset 0 1px 0 rgb(255 255 255 / 0.06),
    inset 0 -1px 0 rgb(0 0 0 / 0.18);
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{
    background-color:rgb(26 30 35 / var(--glass-opacity));
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(125%);
    backdrop-filter:blur(var(--glass-blur)) saturate(125%);
  }
}
.glass--dense{--glass-opacity:0.80;}
.panel.glass{--glass-radius:var(--r-md);overflow:hidden;}
.panel.glass .panel-head{background:transparent;border-bottom-color:rgb(255 255 255 / 0.08);}
.panel.glass .rows .row{border-bottom-color:rgb(255 255 255 / 0.06);}
@media (prefers-reduced-transparency:reduce){
  .glass{
    background-color:#25292e;
    background-image:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
}

/* ===== badges ===== */
.badge{display:inline-flex;align-items:center;gap:var(--xs);font-size:11px;padding:1px var(--sm);border:1px solid var(--border-default);border-radius:var(--r-sm);color:var(--text-label);white-space:nowrap;}
.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--border-default));}
.badge.stale{color:var(--stale);border-color:color-mix(in srgb,var(--stale) 40%,var(--border-default));}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border-default));}
.badge.critical{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 45%,var(--border-default));}
.badge.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border-default));}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--unknown);}
.dot.good{background:var(--good);} .dot.stale{background:var(--stale);} .dot.bad{background:var(--bad);}
.dot.critical{background:var(--critical);} .dot.accent{background:var(--accent);}
.uses{font-size:11px;color:var(--text-muted);font-family:var(--mono);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:0 4px;cursor:pointer;}
.uses:hover{color:var(--text-value);border-color:var(--border-default);}
.q{display:inline-flex;gap:var(--xs);align-items:baseline;font-size:11px;color:var(--text-muted);border:1px dashed var(--border-default);border-radius:var(--r-sm);padding:2px var(--sm);max-width:80ch;}
.q b{color:var(--text-label);font-weight:500;}
.refs{margin-top:var(--xxl);padding-top:var(--md);border-top:1px solid var(--border-subtle);display:flex;gap:var(--xs);flex-wrap:wrap;align-items:center;}
.ref{font-family:var(--mono);font-size:10px;color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:1px 5px;}
.ref.j{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--border-subtle));}

/* ===== wizard ===== */
.screen:has(.wizard-flow){align-items:center;}
.wizard-flow{
  width:100%;max-width:742px;margin-inline:auto;flex:1 1 auto;min-height:100%;
  display:flex;flex-direction:column;align-items:stretch;
}
.wizard-stage{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:0;padding-block:var(--md);box-sizing:border-box;
}
.wizard-flow>.refs{flex-shrink:0;margin-top:0;padding-top:var(--md);width:100%;justify-content:center;}
.wizard-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:var(--md);flex-wrap:wrap;
  width:100%;margin-bottom:var(--lg);
}
.wizard-head h1{margin-bottom:0;}
.wizard{
  display:grid;grid-template-columns:210px 500px;gap:var(--xxl);align-items:start;
  width:100%;max-width:742px;margin-inline:auto;
}
.wizard-main{width:500px;max-width:100%;min-width:0;}
.wizard-main .field{max-width:none;}
.wizard-side{width:100%;min-width:0;max-width:210px;position:sticky;top:var(--md);align-self:start;z-index:1;}
.wizard-side .wsteps{position:static;top:auto;}
.wizard-side .draftpane{position:static;top:auto;}
@media (max-width:760px){
  .wizard{grid-template-columns:1fr;gap:var(--lg);max-width:500px;}
  .wizard-flow,.wizard-head{max-width:500px;}
  .wizard-side{max-width:none;position:static;}
}
.wsteps{display:flex;flex-direction:column;border-left:1px solid var(--border-subtle);position:sticky;top:0;}
.wstep{position:relative;padding:var(--sm) 0 var(--sm) var(--lg);font-size:12px;color:var(--text-muted);}
.wstep::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:transparent;}
.wstep.active{color:var(--text-value);font-weight:500;}
.wstep.active::before{background:var(--accent);}
.wstep.done{color:var(--text-label);}
.wstep.done::after{content:"✓";position:absolute;left:-6px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--good);color:#0E1A1F;font-size:8px;display:flex;align-items:center;justify-content:center;}
.wstep .sn{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-right:var(--xs);}

/* ===== progress ===== */
.bar{height:4px;border-radius:2px;background:var(--bg-sunken);overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent);}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--border-default);border-top-color:var(--accent);display:inline-block;animation:sp .7s linear infinite;flex:0 0 auto;}
@keyframes sp{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;}}

/* ===== tabs (единственный уровень — открытые комплекты) ===== */
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--border-default);background:var(--bg-surface);overflow-x:auto;flex:0 0 auto;}
.tab{display:flex;align-items:center;gap:var(--sm);height:var(--c-default);padding:0 var(--md);color:var(--text-label);cursor:pointer;border:none;background:none;white-space:nowrap;border-right:1px solid var(--border-subtle);}
.tab:hover{background:var(--ov-hover);}
.tab.selected{background:var(--ov-selected);color:var(--text-value);}
.tab .x{color:var(--text-muted);font-size:11px;}
.tab .x:hover{color:var(--text-value);}
.tab.add{color:var(--text-muted);}

/* ===== tree ===== */
.tree{font-size:13px;}
.tree-row{display:flex;align-items:center;gap:var(--xs);height:var(--c-compact);padding-right:var(--sm);color:var(--text-label);cursor:pointer;user-select:none;}
.tree-row:hover{background:var(--ov-hover);}
.tree-row:active{background:var(--ov-pressed);}
.tree-row.selected{background:var(--ov-selected);color:var(--text-value);}
.tree-row .chev{width:12px;flex:0 0 auto;color:var(--text-muted);font-size:9px;text-align:center;}
.tree-row .ico{width:16px;flex:0 0 auto;text-align:center;font-size:12px;}
.tree-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree-row.uncovered .t{color:var(--stale);}
.tree-row.dim .t{color:var(--text-disabled);}

/* ===== КОНФИГУРАТОР: одно рабочее пространство на весь экран ===== */
.cfg{display:flex;flex-direction:column;height:100%;min-height:0;}
.cfg-ctx{display:flex;gap:var(--md);align-items:center;flex-wrap:wrap;padding:0 var(--md);height:var(--c-default);border-bottom:1px solid var(--border-subtle);color:var(--text-label);font-size:12px;flex:0 0 auto;background:var(--bg-surface);}
.cfg-tb{display:flex;align-items:center;gap:var(--xs);padding:var(--xs) var(--md);border-bottom:1px solid var(--border-default);flex:0 0 auto;background:var(--bg-surface);flex-wrap:nowrap;overflow-x:auto;}
.cfg-tb>*{flex:0 0 auto;}
.cfg-ctx{flex-wrap:nowrap;overflow-x:auto;}
.cfg-ctx>*{flex:0 0 auto;}
.cfg-body{flex:1;display:flex;min-height:0;}
.rail{width:40px;flex:0 0 auto;background:var(--bg-surface);border-right:1px solid var(--border-default);display:flex;flex-direction:column;align-items:center;padding:var(--xs) 0;gap:2px;overflow-y:auto;}
.rail button{width:32px;height:32px;border:none;background:none;color:var(--text-label);border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;}
.rail button:hover{background:var(--ov-hover);color:var(--text-value);}
.rail button.on{background:var(--ov-selected);color:var(--text-value);}
.cfg-cols{flex:1;display:flex;min-width:0;}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-surface);border-right:1px solid var(--border-default);}
.col:last-child{border-right:none;}
.col.tree-col{width:290px;flex:0 0 auto;}
.col.insp-col{width:310px;flex:0 0 auto;border-right:none;border-left:1px solid var(--border-default);}
.col.canvas-col{flex:1;background:var(--bg-sunken);}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sm);padding:0 var(--xs) 0 var(--md);height:var(--c-default);border-bottom:1px solid var(--border-subtle);color:var(--text-label);font-size:12px;flex:0 0 auto;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;}
.col-head>span:first-child{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;}
.canvas-col .col-head .tb{flex:0 0 auto;}
.col-body{overflow:auto;flex:1;padding:var(--xs) 0;}
.col-body.pad{padding:var(--md);}
@media (max-width:1100px){
  .cfg-cols{flex-direction:column;overflow-y:auto;}
  .col.tree-col,.col.insp-col{width:100%;height:280px;border-right:none;border-left:none;border-bottom:1px solid var(--border-default);}
  .col.canvas-col{min-height:360px;}
}
.canvas-area{flex:1;padding:var(--lg);overflow:auto;}
.stage{background:var(--bg-canvas);border:1px solid var(--border-default);border-radius:var(--r-sm);min-height:100%;padding:var(--lg);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--md);align-content:start;}
.el{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-sm);padding:var(--sm) var(--md);cursor:pointer;min-height:72px;display:flex;flex-direction:column;gap:var(--xxs);text-align:left;color:var(--text-value);}
.el:hover{background:var(--ov-hover);}
.el.selected{outline:1px solid var(--accent);background:var(--ov-selected);}
.el .code{font-family:var(--mono);font-size:10px;color:var(--text-muted);background:none;border:none;padding:0;}
.el .nm{font-size:12px;}
.el .val{font-family:var(--mono);font-size:11px;color:var(--text-label);}
.el .foot{margin-top:auto;display:flex;gap:var(--xs);align-items:center;}
.el .track{flex:1;height:6px;border-radius:3px;background:var(--bg-sunken);border:1px solid var(--border-default);overflow:hidden;}
.el .track i{display:block;height:100%;background:var(--accent);}
.el.unbound{border-style:dashed;}
/* нижний док: инструменты внутри того же экрана */
.dock{flex:0 0 auto;border-top:1px solid var(--border-default);background:var(--bg-surface);display:flex;flex-direction:column;min-height:0;}
.dock.open{height:clamp(240px,34vh,380px);}
.dock.closed{height:var(--c-default);}
.dock-head{display:flex;align-items:center;gap:var(--sm);padding:0 var(--sm) 0 var(--md);height:var(--c-default);border-bottom:1px solid var(--border-subtle);flex:0 0 auto;}
.dock-title{font-size:12px;color:var(--text-value);font-weight:500;}
.dock-sub{font-size:11px;color:var(--text-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dock-body{flex:1;overflow:auto;min-height:0;}
.dock-split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);height:100%;min-height:0;}
@media (max-width:900px){.dock-split{grid-template-columns:1fr;}}
.dock-split>*{min-width:0;overflow:auto;}
.dock-split>*+*{border-left:1px solid var(--border-subtle);}
.dock-pad{padding:var(--md);}
.dock-foot{display:flex;gap:var(--sm);align-items:center;padding:var(--sm) var(--md);border-top:1px solid var(--border-subtle);flex-wrap:wrap;}
/* библиотека элементов */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--sm);padding:var(--md);}
.libcard{border:1px solid var(--border-default);border-radius:var(--r-sm);background:var(--bg-raised);padding:var(--sm);cursor:pointer;text-align:left;color:var(--text-value);display:flex;flex-direction:column;gap:2px;}
.libcard:hover{background:var(--ov-hover);border-color:var(--border-strong);}
.libcard.on{background:var(--ov-selected);border-color:var(--accent);}
.libcard .c{font-family:var(--mono);font-size:10px;color:var(--text-muted);}
.libcard .n{font-size:12px;}
.libcard .w{font-size:10px;color:var(--text-muted);}
table.t{width:100%;border-collapse:collapse;font-size:12px;}
table.t th{text-align:left;font-weight:400;color:var(--text-label);font-size:11px;padding:var(--xs) var(--md);border-bottom:1px solid var(--border-default);white-space:nowrap;position:sticky;top:0;background:var(--bg-surface);}
table.t td{padding:var(--xs) var(--md);border-bottom:1px solid var(--border-subtle);vertical-align:middle;}
table.t tr:hover td{background:var(--ov-hover);}
.tablewrap{overflow:auto;}
.codebox{background:var(--bg-sunken);border:1px solid var(--border-default);border-radius:var(--r-sm);font-family:var(--mono);font-size:12px;line-height:1.6;padding:var(--md);overflow:auto;color:var(--text-value);white-space:pre;margin:0;}
.codebox .c{color:var(--text-muted);} .codebox .k{color:var(--accent);} .codebox .s{color:var(--good);}

/* ===== modal (только для действий с явным согласием) ===== */
.scrim{position:fixed;inset:0;background:rgba(10,11,13,.6);display:flex;align-items:center;justify-content:center;padding:var(--lg);z-index:50;}
.modal{background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--r-md);width:min(560px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;}
.modal.wide{width:min(760px,100%);}
.modal-head{padding:var(--md) var(--lg);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:var(--md);}
.modal-body{padding:var(--lg);overflow:auto;}
.modal-foot{padding:var(--md) var(--lg);border-top:1px solid var(--border-subtle);display:flex;gap:var(--sm);justify-content:flex-end;flex-wrap:wrap;}
.affected{border:1px solid var(--border-default);border-radius:var(--r-sm);background:var(--bg-sunken);max-height:220px;overflow:auto;}
.affected .a{display:flex;gap:var(--sm);align-items:center;padding:var(--xs) var(--md);border-bottom:1px solid var(--border-subtle);font-size:12px;}
.affected .a:last-child{border-bottom:none;}
.affected .a .src{font-family:var(--mono);font-size:11px;color:var(--text-muted);}

/* ===== context menu ===== */
.ctxmenu{position:fixed;z-index:60;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--r-md);padding:var(--xs) 0;min-width:216px;}
.ctx-item{display:flex;align-items:center;gap:var(--sm);height:var(--c-compact);padding:0 var(--md);color:var(--text-value);cursor:pointer;font-size:13px;}
.ctx-item:hover{background:var(--ov-hover);}
.ctx-item.dis{color:var(--text-disabled);cursor:not-allowed;} .ctx-item.dis:hover{background:none;}
.ctx-item .ico{width:16px;text-align:center;font-size:12px;color:var(--text-label);}
.ctx-item .sub{margin-left:auto;color:var(--text-muted);font-size:10px;}
.ctx-sep{height:1px;background:var(--border-subtle);margin:var(--xs) 0;}
.ctx-icons{display:flex;gap:var(--xs);padding:var(--xs) var(--md);}
.ctx-icons button{width:var(--c-compact);height:var(--c-compact);border:1px solid transparent;border-radius:var(--r-sm);background:none;color:var(--text-label);cursor:pointer;}
.ctx-icons button:hover{background:var(--ov-hover);color:var(--text-value);}
.ctxsub{position:fixed;z-index:61;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--r-md);padding:var(--xs) 0;min-width:190px;}

/* ===== toast ===== */
.toasts{position:fixed;right:var(--lg);bottom:var(--lg);display:flex;flex-direction:column;gap:var(--sm);z-index:70;max-width:min(420px,calc(100vw - 32px));}
.toast{background:var(--bg-raised);border:1px solid var(--border-default);border-left-width:2px;border-radius:var(--r-md);padding:var(--sm) var(--md);font-size:12px;display:flex;gap:var(--sm);}
.toast.good{border-left-color:var(--good);} .toast.warn{border-left-color:var(--stale);}
.toast.bad{border-left-color:var(--bad);} .toast.info{border-left-color:var(--accent);}

/* ===== map / choices ===== */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--md);}
.mapcard{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-md);overflow:hidden;}
.mapcard h3{padding:var(--md) var(--lg) var(--xs);}
.mapcard .jt{padding:0 var(--lg) var(--sm);font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.maplink{display:flex;gap:var(--sm);align-items:center;width:100%;border:none;background:none;text-align:left;color:var(--text-label);padding:var(--xs) var(--lg);cursor:pointer;min-height:var(--c-compact);border-top:1px solid var(--border-subtle);}
.maplink:hover{background:var(--ov-hover);color:var(--text-value);}
.maplink .n{font-family:var(--mono);font-size:10px;color:var(--text-muted);width:26px;flex:0 0 auto;}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--md);}
.alt{display:flex;gap:var(--md);align-items:flex-start;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--md) var(--lg);cursor:pointer;text-align:left;color:var(--text-value);width:100%;max-width:720px;}
.alt:hover{background:var(--ov-hover);border-color:var(--border-strong);}
.alt .ico{font-size:16px;color:var(--text-label);width:20px;flex:0 0 auto;text-align:center;}
.alt .d{font-size:11px;color:var(--text-muted);margin-top:2px;}
.alt .arrow{margin-left:auto;color:var(--text-muted);align-self:center;}
.alt:hover .arrow{color:var(--accent);}

/* ===== стартовый экран (prod layout) ===== */
.screen:has(.boot-stage){align-items:center;}
.boot-stage{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;max-width:560px;
  min-height:0;padding-block:var(--md);box-sizing:border-box;
}
.screen:has(.boot-stage)>.refs{flex-shrink:0;margin-top:0;width:100%;max-width:560px;}
.boot{display:flex;flex-direction:column;align-items:center;gap:var(--lg);width:100%;max-width:560px;margin:0;}
.boot-hero{width:100%;text-align:center;}
.boot-status{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--sm);width:100%;margin-bottom:var(--md);}
.boot-status .boot-step-hint{margin-left:auto;text-align:right;}
.boot-step-hint{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.boot-hero h1{margin-bottom:var(--xs);}
.boot-lead{margin:0 auto;max-width:42ch;font-size:13px;color:var(--text-label);line-height:1.45;}
.boot-metrics{width:100%;}
.boot-metrics .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sm);margin:0;padding:var(--md);border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-surface);box-shadow:var(--elev-2-shadow);}
.boot-metrics .facts>div{display:flex;flex-direction:column;align-items:flex-start;gap:var(--xxs);min-width:0;padding:0 var(--xs);}
.boot-metrics .facts .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
.boot-metrics .facts .v{font-size:11px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.boot-body{width:100%;}
.boot-card.panel{width:100%;overflow:visible;background:transparent;border:none;border-radius:0;box-shadow:none;}
.boot-card .panel-head{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 0 var(--md);min-height:0;background:transparent;border:none;box-shadow:none;}
.boot-card .panel-head h2{margin:0 0 var(--xxs);}
.boot-card .panel-head .xs{display:block;}
.boot-card .panel-body{width:320px;max-width:100%;margin-inline:auto;padding:var(--lg);background:var(--bg-raised);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-md);box-sizing:border-box;box-shadow:var(--elev-3-shadow);}
.boot-form-stack .field{max-width:none;margin-bottom:var(--md);}
.boot-form-stack .field:last-child{margin-bottom:0;}
.boot-form-actions{display:flex;flex-direction:column;align-items:center;gap:var(--xs);width:320px;max-width:100%;margin-inline:auto;margin-top:var(--md);}
.boot-form-actions .btn.primary.large{width:150px;max-width:100%;justify-content:center;}
.boot-form-actions .xs.muted{text-align:center;line-height:1.4;}
.boot-more{width:100%;margin-top:var(--lg);border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-surface);box-shadow:var(--elev-2-shadow);}
.boot-more>summary{cursor:pointer;list-style:none;padding:var(--sm) var(--md);font-size:12px;font-weight:500;color:var(--text-label);user-select:none;}
.boot-more>summary::-webkit-details-marker{display:none;}
.boot-more>summary::after{content:"▾";float:right;color:var(--text-muted);transition:transform .15s ease;}
.boot-more[open]>summary::after{transform:rotate(180deg);}
.boot-more[open]>summary{border-bottom:1px solid var(--border-subtle);}
.boot-alts{display:grid;grid-template-columns:1fr;gap:var(--sm);padding:var(--md);}
@media (min-width:560px){.boot-alts{grid-template-columns:1fr 1fr;}}
.boot-alts .alt{max-width:none;margin:0;}
.boot-analyst{width:100%;margin-top:var(--md);border:1px dashed var(--border-subtle);border-radius:var(--r-sm);}
.boot-analyst>summary{cursor:pointer;list-style:none;padding:var(--xs) var(--sm);font-size:10px;color:var(--text-muted);}
.boot-analyst>summary::-webkit-details-marker{display:none;}
.boot-analyst .q{display:block;max-width:none;margin:0;border:none;border-radius:0;padding:var(--sm);}
.facts{display:flex;flex-direction:column;gap:var(--sm);margin-top:var(--lg);border-top:1px solid var(--border-subtle);padding-top:var(--md);}
.facts div{display:flex;justify-content:space-between;gap:var(--md);font-size:12px;}
.facts dt,.facts .k{color:var(--text-muted);}
.facts dd,.facts .v{margin:0;font-family:var(--mono);color:var(--text-value);}
@media (max-width:640px){
  .boot-metrics .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--md);}
}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--border-default);border-radius:var(--r-sm);font-family:var(--mono);font-size:11px;color:var(--text-label);flex:0 0 auto;}
.stepno.accent{border-color:var(--accent);color:var(--accent);}

/* ===== прогресс мастера ===== */
.progress{display:flex;align-items:center;gap:var(--sm);min-width:180px;}
.progress .t{font-size:11px;color:var(--text-muted);font-family:var(--mono);white-space:nowrap;}
.progress .bar{flex:1;min-width:90px;}

/* ===== карточки выбора (check-row как карточка) ===== */
.checkcard{display:flex;gap:var(--sm);align-items:flex-start;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--sm) var(--md);cursor:pointer;margin-bottom:var(--sm);}
.checkcard:hover{background:var(--ov-hover);}
.checkcard.on{background:var(--ov-selected);border-color:var(--accent);}
.checkcard input{margin-top:3px;accent-color:var(--accent);flex:0 0 auto;}
.checkcard .t{font-size:13px;}
.checkcard .d{font-size:11px;color:var(--text-muted);margin-top:2px;}
.checkcard .meta{margin-left:auto;align-self:center;font-size:11px;color:var(--text-muted);font-family:var(--mono);white-space:nowrap;}

/* ===== поле с единицей измерения ===== */
.suffix{display:flex;align-items:stretch;}
.suffix .input{border-top-right-radius:0;border-bottom-right-radius:0;}
.suffix .u{display:flex;align-items:center;padding:0 var(--md);border:1px solid var(--border-default);border-left:none;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--bg-raised);color:var(--text-muted);font-size:12px;white-space:nowrap;}

/* ===== чек-лист проверки ===== */
.verify{border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);overflow:hidden;}
.verify .v{display:flex;gap:var(--sm);align-items:center;padding:var(--sm) var(--md);border-bottom:1px solid var(--border-subtle);}
.verify .v-body{flex:1 1 auto;min-width:0;}
.verify .v-action{flex:0 0 auto;margin-left:auto;align-self:center;}
.verify .v:last-child{border-bottom:none;}
.verify .mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;
  background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good);}
.verify .mark.warn{background:color-mix(in srgb,var(--stale) 22%,transparent);color:var(--stale);}
.verify .mark.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);}
.verify .mark.wait{background:none;border:2px solid var(--border-default);}
.verify .tt{font-size:12px;} .verify .dd{font-size:11px;color:var(--text-muted);}

/* ===== готовность и сводка ===== */
.ready{display:flex;gap:var(--lg);align-items:center;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--md) var(--lg);flex-wrap:wrap;}
.ready .pct{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums;line-height:1;}
.ready .lbl{font-size:11px;color:var(--text-muted);}
.ready .split{display:flex;gap:var(--xl);flex-wrap:wrap;flex:1;}
.ready .split div{display:flex;flex-direction:column;gap:2px;}
.ready .split .k{font-size:11px;color:var(--text-muted);}
.ready .split .v{font-family:var(--mono);font-size:13px;}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--md);}
.sumgrid>div{border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--md);}
.sumgrid .k{font-size:11px;color:var(--text-muted);}
.sumgrid .v{font-size:13px;margin-top:2px;}
.sumgrid .d{font-size:11px;color:var(--text-muted);margin-top:var(--xxs);}

/* ===== карточки способа создания и темы ===== */
.createcard{display:flex;flex-direction:column;gap:var(--sm);align-items:flex-start;text-align:left;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--lg);cursor:pointer;color:var(--text-value);height:100%;}
.createcard:hover{background:var(--ov-hover);border-color:var(--border-strong);}
.createcard.rec{border-color:color-mix(in srgb,var(--accent) 45%,var(--border-default));}
.createcard p{margin:0;font-size:12px;color:var(--text-muted);}
.createcard.glass{
  --glass-radius:var(--r-md);
  background-color:#25292e;
  background-image:linear-gradient(135deg,rgb(255 255 255 / 0.08) 0%,rgb(255 255 255 / 0.02) 45%,rgb(255 255 255 / 0) 100%);
  background-clip:padding-box;
  border:1px solid rgb(255 255 255 / 0.10);
  border-top-color:rgb(255 255 255 / 0.22);
  border-left-color:rgb(255 255 255 / 0.15);
  box-shadow:
    0 12px 32px rgb(0 0 0 / 0.22),
    0 2px 8px rgb(0 0 0 / 0.12),
    inset 0 1px 0 rgb(255 255 255 / 0.06),
    inset 0 -1px 0 rgb(0 0 0 / 0.14);
  transition:background-color 0.15s ease,border-color 0.15s ease,box-shadow 0.15s ease;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .createcard.glass{
    background-color:rgb(26 30 35 / var(--glass-opacity));
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(125%);
    backdrop-filter:blur(var(--glass-blur)) saturate(125%);
  }
}
.createcard.glass:hover{
  background-color:rgb(32 36 42 / 0.88);
  border-color:rgb(255 255 255 / 0.14);
  border-top-color:rgb(255 255 255 / 0.30);
  box-shadow:
    0 14px 36px rgb(0 0 0 / 0.26),
    0 3px 10px rgb(0 0 0 / 0.14),
    inset 0 1px 0 rgb(255 255 255 / 0.08),
    inset 0 -1px 0 rgb(0 0 0 / 0.14);
}
.createcard.rec.glass{
  border-color:color-mix(in srgb,var(--accent) 40%,rgb(255 255 255 / 0.12));
  border-top-color:color-mix(in srgb,var(--accent) 55%,rgb(255 255 255 / 0.24));
  box-shadow:
    0 12px 32px rgb(0 0 0 / 0.22),
    0 2px 8px rgb(0 0 0 / 0.12),
    0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent),
    inset 0 1px 0 rgb(255 255 255 / 0.07),
    inset 0 -1px 0 rgb(0 0 0 / 0.14);
}
.createcard.rec.glass:hover{
  border-top-color:color-mix(in srgb,var(--accent) 65%,rgb(255 255 255 / 0.28));
  box-shadow:
    0 14px 36px rgb(0 0 0 / 0.26),
    0 3px 10px rgb(0 0 0 / 0.14),
    0 0 0 1px color-mix(in srgb,var(--accent) 24%,transparent),
    inset 0 1px 0 rgb(255 255 255 / 0.09),
    inset 0 -1px 0 rgb(0 0 0 / 0.14);
}
.themecard{display:flex;flex-direction:column;gap:var(--xs);border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);padding:var(--sm);cursor:pointer;}
.themecard.on{border-color:var(--accent);background:var(--ov-selected);}
.themeprev{height:56px;border-radius:var(--r-sm);display:flex;gap:4px;padding:var(--sm);border:1px solid var(--border-default);}
.themeprev i{flex:1;border-radius:2px;}
.themeprev.dark{background:#17181B;} .themeprev.dark i{background:#2A2D32;} .themeprev.dark i:first-child{background:#4F8FA6;}
.themeprev.light{background:#EDEEF0;} .themeprev.light i{background:#D3D6DA;} .themeprev.light i:first-child{background:#4F8FA6;}
.themeprev.custom{background:var(--bg-sunken);border-style:dashed;} .themeprev.custom i{background:var(--bg-raised);}

/* ===== строка подбора устройства в мастере ===== */
.devline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:var(--sm);align-items:center;padding:var(--xs) var(--md);border-bottom:1px solid var(--border-subtle);}
.devline:last-of-type{border-bottom:none;}
@media (max-width:900px){.devline{grid-template-columns:1fr 1fr;}}
.devhead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:var(--sm);padding:var(--xs) var(--md);font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-default);}
@media (max-width:900px){.devhead{display:none;}}
.search{position:relative;}
.search input{padding-left:26px;}
.search::before{content:"⌕";position:absolute;left:var(--sm);top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:12px;pointer-events:none;}
.search.missing input{border-color:color-mix(in srgb,var(--stale) 55%,var(--border-default));}

/* ===== дерево-черновик мастера (не использовать .dim — конфликт с направляющими холста) ===== */
.draftpane{display:flex;flex-direction:column;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-surface);overflow:hidden;box-sizing:border-box;width:100%;}
.draftpane-head{padding:var(--sm) var(--md);border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-label);display:flex;justify-content:space-between;gap:var(--sm);}
.draftpane-row{display:flex;gap:var(--sm);align-items:center;padding:var(--xs) var(--md);font-size:12px;min-height:var(--c-compact);line-height:1.35;box-sizing:border-box;position:relative;}
.draftpane-row .g{width:16px;flex:0 0 auto;text-align:center;color:var(--text-label);}
.draftpane-row b,.draftpane-row>span:not(.g){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.draftpane-row em{margin-left:auto;flex:0 0 auto;font-style:normal;font-size:10px;color:var(--stale);white-space:nowrap;}
.draftpane-row--muted{color:var(--text-muted);}
.draftpane-sec{padding:var(--sm) var(--md) var(--xs);border-top:1px solid var(--border-subtle);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);line-height:1.35;}
.draftpane-note{padding:var(--sm) var(--md);border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-muted);line-height:1.4;}

/* ===== перетаскивание в конфигураторе ===== */
[draggable="true"]{cursor:grab;}
[draggable="true"]:active{cursor:grabbing;}
.dragging{opacity:.45;}
.dz-ok{outline:1px solid var(--accent);outline-offset:-1px;background:var(--ov-selected)!important;}
.dz-no{outline:1px dashed var(--bad);outline-offset:-1px;cursor:not-allowed;}
.stage.dz-ok{outline:2px dashed var(--accent);outline-offset:-4px;}
.stage.dz-no{outline:2px dashed var(--bad);outline-offset:-4px;}
.draghint{position:fixed;left:50%;bottom:var(--lg);transform:translateX(-50%);z-index:80;display:flex;gap:var(--sm);align-items:center;
  background:var(--bg-raised);border:1px solid var(--border-default);border-left:2px solid var(--accent);border-radius:var(--r-md);
  padding:var(--sm) var(--md);font-size:12px;color:var(--text-value);pointer-events:none;max-width:min(560px,calc(100vw - 32px));}
.draghint.no{border-left-color:var(--bad);color:var(--text-label);}
.draghint .g{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.dirbtn{font-family:var(--mono);font-size:13px;background:none;border:1px solid transparent;border-radius:var(--r-sm);
  color:var(--accent);cursor:pointer;width:28px;height:var(--c-compact);line-height:1;}
.dirbtn:hover{background:var(--ov-hover);border-color:var(--border-default);}
.dirbtn.ro{color:var(--text-muted);cursor:default;}
.dirbtn.ro:hover{background:none;border-color:transparent;}
.el .dir{font-family:var(--mono);font-size:11px;color:var(--accent);}

/* ===== холст: рабочая область, масштаб, панорамирование ===== */
.canvas-area{position:relative;flex:1;overflow:hidden;padding:0;}
.canvas-vp{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--border-subtle) 1px, transparent 0) 0 0/24px 24px, var(--bg-sunken);}
.canvas-vp.hand{cursor:grab;}
.canvas-vp.hand.panning{cursor:grabbing;}
.canvas-vp.live{background:var(--bg-sunken);}
.world{position:absolute;left:0;top:0;transform-origin:0 0;}
.frame{position:relative;background:var(--bg-canvas);border:1px solid var(--border-strong);border-radius:var(--r-sm);
  box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.canvas-vp.live .frame{border-color:color-mix(in srgb,var(--accent) 40%,var(--border-default));overflow:hidden;}
.frame.as-popup{background:var(--bg-surface);}
.frame-label{position:absolute;left:0;top:-22px;font-size:11px;font-family:var(--mono);color:var(--text-muted);white-space:nowrap;}
/* направляющие, размеры и рамка выделения */
.guides{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;}
.guide{position:absolute;background:#E0559E;}
.guide.v{top:0;bottom:0;width:1px;}
.guide.h{left:0;right:0;height:1px;}
.guide.frame{background:#C4A24E;}
.dim{position:absolute;pointer-events:none;}
.dim.x{height:0;border-top:1px dashed #E0559E;}
.dim.y{width:0;border-left:1px dashed #E0559E;}
.dim-val{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#E0559E;color:#17181B;
  font-family:var(--mono);font-size:10px;line-height:1;padding:2px 4px;border-radius:2px;white-space:nowrap;}
.rubber{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  pointer-events:none;z-index:7;}
.el.multi{outline:1px solid var(--accent);}
.canvas-hint{position:absolute;left:var(--md);bottom:var(--md);background:var(--bg-raised);border:1px solid var(--border-default);
  border-radius:var(--r-sm);padding:var(--xs) var(--sm);font-size:11px;font-family:var(--mono);color:var(--text-label);pointer-events:none;z-index:8;}
.page-tabs{display:flex;gap:2px;align-items:center;overflow-x:auto;}
.page-tab{display:flex;align-items:center;gap:var(--xs);height:var(--c-compact);padding:0 var(--sm);border:1px solid transparent;border-radius:var(--r-sm);
  background:none;color:var(--text-label);cursor:pointer;font-size:12px;white-space:nowrap;}
.page-tab:hover{background:var(--ov-hover);color:var(--text-value);}
.page-tab.on{background:var(--ov-selected);color:var(--text-value);border-color:color-mix(in srgb,var(--accent) 35%,transparent);}
.page-tab .pg-ico{display:inline-flex;color:var(--text-muted);}
.page-tab.add{color:var(--text-muted);}
.tab-sep{width:1px;height:14px;background:var(--border-default);margin:0 var(--xs);flex:0 0 auto;}

/* группа-виджет */
.grp{position:absolute;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);
  background:color-mix(in srgb,var(--accent) 5%,transparent);cursor:move;z-index:1;}
.grp.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);}
.grp.editing{border-style:solid;border-color:color-mix(in srgb,var(--stale) 55%,transparent);
  background:color-mix(in srgb,var(--stale) 5%,transparent);cursor:default;pointer-events:none;}
.grp.editing .grp-head{pointer-events:auto;}
.grp-head{position:absolute;left:0;top:-2px;transform:translateY(-100%);display:flex;gap:var(--xs);align-items:center;
  background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--r-sm);padding:1px var(--xs);white-space:nowrap;}
.grp-name{font-size:11px;color:var(--text-value);}
.grp-sub{font-size:10px;font-family:var(--mono);color:var(--text-muted);}
.grp-btn{height:18px;padding:0 var(--xs);border:1px solid var(--border-default);border-radius:var(--r-sm);
  background:var(--bg-surface);color:var(--text-label);font-size:10px;cursor:pointer;}
.grp-btn:hover{background:var(--ov-hover);color:var(--text-value);}
.grp-btn.on{background:var(--ov-selected);color:var(--text-value);border-color:var(--accent);}

/* общая оболочка элемента на холсте */
.el{position:absolute;display:flex;flex-direction:column;gap:2px;padding:var(--xs) var(--sm);background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--r-sm);cursor:default;min-width:0;overflow:hidden;color:var(--text-value);text-align:left;z-index:2;}
.el.in-group{pointer-events:none;}
.el.moving{opacity:.85;outline:1px solid var(--accent);z-index:9;}
.canvas-vp.hand .el{pointer-events:none;}
.el:hover{border-color:var(--border-strong);}
.el.selected{outline:1px solid var(--accent);background:var(--ov-selected);}
.el.unbound{border-style:dashed;}

.el-tag{display:flex;gap:var(--xs);align-items:center;flex:0 0 auto;font-size:10px;font-family:var(--mono);color:var(--text-muted);min-width:0;cursor:grab;}
.el-tag .bnd{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.el-tag .nb{color:var(--stale);}
.canvas-vp.live .el{cursor:default;}
.el-ico{display:inline-flex;color:var(--text-label);}

/* лейбл */
.w-lbl{flex:1;display:flex;gap:var(--sm);align-items:center;min-width:0;overflow:hidden;}
.w-lbl.col{flex-direction:column;align-items:flex-start;gap:2px;}
.w-lbl.ha-c{justify-content:center;text-align:center;} .w-lbl.ha-r{justify-content:flex-end;text-align:right;}
.w-lbl.va-t{align-items:flex-start;} .w-lbl.va-b{align-items:flex-end;}
.w-lbl .lbl-ico{color:var(--accent);font-size:14px;flex:0 0 auto;}
.w-lbl .lbl-txt{min-width:0;}
.w-lbl.s-lg .lbl-txt{font-size:16px;} .w-lbl.s-sm .lbl-txt{font-size:11px;}
.lbl-ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lbl-clip{overflow:hidden;white-space:nowrap;}
.lbl-wrap{overflow:hidden;}
.lbl-shrink{overflow:hidden;font-size:11px!important;white-space:nowrap;}

/* кнопка */
.w-btn{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;border:1px solid var(--border-default);
  border-radius:var(--r-sm);background:var(--bg-raised);padding:var(--xs) var(--sm);min-width:0;user-select:none;}
.canvas-vp.live .w-btn{cursor:pointer;}
.canvas-vp.live .w-btn:hover{background:var(--ov-hover);}
.w-btn.on,.w-btn.act{background:var(--accent);border-color:var(--accent);color:#0E1A1F;}
.w-btn .cap{font-size:12px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.w-btn .sub{font-size:10px;font-family:var(--mono);opacity:.7;}

/* триггерная кнопка */
.w-trg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--xs);border:1px solid var(--border-default);
  border-radius:var(--r-sm);background:var(--bg-raised);padding:var(--xs);user-select:none;}
.canvas-vp.live .w-trg{cursor:pointer;}
.w-trg .knob{width:34px;height:18px;border-radius:9px;background:var(--bg-sunken);border:1px solid var(--border-default);position:relative;flex:0 0 auto;}
.w-trg .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-muted);transition:left .12s ease,background .12s ease;}
.w-trg.on .knob{background:color-mix(in srgb,var(--accent) 35%,var(--bg-sunken));border-color:var(--accent);}
.w-trg.on .knob::after{left:18px;background:var(--accent);}
.w-trg .cap{font-size:11px;color:var(--text-label);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.w-trg.on .cap{color:var(--text-value);}
@media (prefers-reduced-motion:reduce){.w-trg .knob::after{transition:none;}}

/* уровень */
.w-lvl{flex:1;display:flex;flex-direction:column;gap:var(--xs);min-width:0;}
.w-lvl.v{flex-direction:column;align-items:center;}
.lvl-head{display:flex;justify-content:space-between;gap:var(--sm);font-size:11px;color:var(--text-label);min-width:0;}
.lvl-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lvl-val{font-family:var(--mono);color:var(--text-value);flex:0 0 auto;}
.lvl-track{position:relative;height:10px;border-radius:5px;background:var(--bg-sunken);border:1px solid var(--border-default);margin-top:auto;}
.lvl-track>i{display:block;height:100%;border-radius:5px 0 0 5px;background:var(--accent);}
.lvl-track .knob{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--text-value);border:1px solid var(--border-strong);}
.lvl-track.v{height:auto;width:10px;flex:1;margin:0 auto;display:flex;align-items:flex-end;}
.lvl-track.v>i{width:100%;border-radius:0 0 5px 5px;align-self:flex-end;}
.lvl-track.v .knob{left:-3px;top:auto;}
.canvas-vp.live .lvl-track{cursor:pointer;touch-action:none;}
.canvas-vp.live .lvl-track .knob{cursor:grab;}
.canvas-vp.live .w-lvl.dragging-lvl{cursor:grabbing;}
.canvas-vp.live .w-lvl.dragging-lvl .lvl-track,.canvas-vp.live .w-lvl.dragging-lvl .knob{cursor:grabbing;}
.canvas-vp.live .w-lvl.dragging-lvl .lvl-track>i{background:var(--accent-hover);}

function elDef(code){ return ELEMENTS.filter(function(e){return e.code===code;})[0]; }
function elProps(el){
  var def = elDef(el.code); if(!def) return {};
  if(!el.p) el.p = {};
  def.props.forEach(function(pr){ if(el.p[pr.k]===undefined) el.p[pr.k] = pr.d; });
  return el.p;
}
function pget(el, k){ return elProps(el)[k]; }
function num(v, d){ var n = parseFloat(v); return isNaN(n)? (d||0) : n; }

function h(tag, attrs, kids){
  var el = document.createElement(tag); attrs = attrs||{};
  for (var k in attrs){
    var v = attrs[k]; if (v===null||v===undefined||v===false) continue;
    if (k==="class") el.className=v;
    else if (k==="html") el.innerHTML=v;
    else if (k==="style") el.setAttribute("style",v);
    else if (k.slice(0,2)==="on") el.addEventListener(k.slice(2), v);
    else if (v===true) el.setAttribute(k,"");
    else el.setAttribute(k,v);
  }
  (kids||[]).forEach(function(c){ if(c===null||c===undefined||c===false) return;
    el.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); });
  return el;
}

    menu.appendChild(el);
  });

   КОНФИГУРАТОР — одно рабочее пространство (US-2)
   Все инструменты — панели нижнего дока того же экрана; отдельных
   страниц нет. Модальные окна остаются только там, где требуется
   явное согласие интегратора (INV-2, INV-4).
   ================================================================== */

/* ==================================================================
   Перетаскивание (ЛКМ): тег → устройство того же типа, тег ⇄ элемент,
   элемент библиотеки → холст. Недопустимость видна в момент действия
   (US-19, OB-28), результат сразу меняет дерево, холст и связи.
   ================================================================== */
var DRAG = null, dragHintEl = null;

function dragHint(text, ok, glyph){
  if(!dragHintEl){ dragHintEl = h("div",{class:"draghint"}); document.body.appendChild(dragHintEl); }
  dragHintEl.className = "draghint"+(ok?"":" no");
  dragHintEl.innerHTML = "";
  dragHintEl.appendChild(h("span",{class:"g"},[glyph || (ok?"⤵":"⃠")]));
  dragHintEl.appendChild(h("span",{},[text]));
}
function clearDrag(){
  DRAG = null;
  if(dragHintEl){ dragHintEl.remove(); dragHintEl = null; }
  Array.prototype.forEach.call(document.querySelectorAll(".dz-ok,.dz-no,.dragging"), function(n){
    n.classList.remove("dz-ok","dz-no","dragging");
  });
}
function dragSource(el, payload, hint){
  el.setAttribute("draggable","true");
  el.addEventListener("dragstart", function(e){
    e.stopPropagation();
    DRAG = payload;
    try{ e.dataTransfer.setData("text/plain", payload.kind); e.dataTransfer.effectAllowed = "link"; }catch(_){}
    el.classList.add("dragging");
    dragHint(hint, true, "⇢");
  });
  el.addEventListener("dragend", function(){ clearDrag(); });
  return el;
}
function dropTarget(el, accept, onDrop){
  el.addEventListener("dragover", function(e){
    if(!DRAG) return;
    var r = accept(DRAG);
    e.preventDefault(); e.stopPropagation();
    try{ e.dataTransfer.dropEffect = r.ok ? "link" : "none"; }catch(_){}
    el.classList.toggle("dz-ok", !!r.ok);
    el.classList.toggle("dz-no", !r.ok);
    dragHint(r.msg, r.ok);
  });
  el.addEventListener("dragleave", function(e){
    e.stopPropagation();
    el.classList.remove("dz-ok","dz-no");
  });
  el.addEventListener("drop", function(e){
    e.preventDefault(); e.stopPropagation();
    var d = DRAG; el.classList.remove("dz-ok","dz-no");
    if(!d) return;
    var r = accept(d);
    if(!r.ok){ toast("bad", r.msg); clearDrag(); return; }
    clearDrag(); onDrop(d);
  });
  return el;
}

/* ---- правила совместимости ---- */
function tagPrefix(d){
  return (d.tags[0] && d.tags[0].name.indexOf(".")>0) ? d.tags[0].name.split(".")[0] : d.id;
}
function acceptTagOnDevice(target){
  return function(d){
    if(d.kind!=="tag") return {ok:false, msg:"Сюда можно перетащить только тег устройства"};
    if(d.devId===target.id) return {ok:false, msg:"Тег уже принадлежит «"+target.name+"»"};
    var src = dev(d.devId);
    if(!target.kind || !src || !src.kind)
      return {ok:false, msg:"Тип устройства не объявлен драйвером — перенос тега недопустим"};
    if(src.kind!==target.kind)
      return {ok:false, msg:"«"+src.kind+"» и «"+target.kind+"» — разные типы устройств, тег не переносится"};
    return {ok:true, msg:"Тег «"+d.name+"» сменит родителя: "+src.name+" → "+target.name};
  };
}
function moveTagToDevice(d, target){
  var src = dev(d.devId); if(!src) return;
  var tag = src.tags.filter(function(t){return t.id===d.tagId;})[0]; if(!tag) return;
  var oldName = tag.name, suffix = oldName.split(".").slice(1).join(".") || oldName;
  var newName = tagPrefix(target)+"."+suffix;
  if(target.tags.some(function(t){return t.name===newName;})){
    toast("bad","В «"+target.name+"» уже есть тег "+newName+" — имя должно быть уникальным");
    return;
  }
  src.tags = src.tags.filter(function(t){return t.id!==tag.id;});
  tag.name = newName; target.tags.push(tag);
  S.placed.forEach(function(e){ if(e.bind===oldName) e.bind = newName; });
  S.openDev = target.id; S.selNode = "tag-"+tag.id;
  kit().dirty = true;
  toast("good","Тег перенесён: "+oldName+" → "+newName+". Связи элементов обновлены.");
  rerender();
}
function acceptTagOnElement(el){
  return function(d){
    var def = elDef(el.code);
    if(d.kind!=="tag") return {ok:false, msg:"Связь создаётся перетаскиванием тега"};
    if(def && !def.bindable) return {ok:false, msg:"«"+def.name+"» не имеет собственного значения — связь не задаётся"};
    if(el.bind===d.name) return {ok:false, msg:"Элемент уже связан с "+d.name};
    return {ok:true, msg: el.bind
      ? "Связь «"+el.name+"» будет заменена: "+el.bind+" → "+d.name
      : "«"+el.name+"» получит связь с "+d.name+" (двунаправленную)"};
  };
}
function acceptElementOnTag(tagName){
  return function(d){
    if(d.kind!=="el") return {ok:false, msg:"Перетащите элемент интерфейса, чтобы связать его с тегом"};
    var el = S.placed.filter(function(x){return x.id===d.elId;})[0];
    var def = el && elDef(el.code);
    if(def && !def.bindable) return {ok:false, msg:"«"+def.name+"» не имеет собственного значения — связь не задаётся"};
    if(el && el.bind===tagName) return {ok:false, msg:"Элемент уже связан с "+tagName};
    return {ok:true, msg:"«"+(el?el.name:"Элемент")+"» получит связь с "+tagName};
  };
}
function bindElement(elId, tagName){
  var el = S.placed.filter(function(x){return x.id===elId;})[0]; if(!el) return;
  var was = el.bind;
  el.bind = tagName; el.dir = el.dir || "⇄";
  var t = tagByName(tagName); if(t) t.uses++;
  if(was){ var o = tagByName(was); if(o && o.uses>0) o.uses--; }
  S.selEl = el.id; S.selNode = null; kit().dirty = true;
  toast("good", (was? "Связь заменена: " : "Связь создана: ")+el.name+" "+(el.dir||"⇄")+" "+tagName);
  rerender();
}

function groupSelection(){
  var els = selectedEls().filter(function(e){ return !e.group; });
  if(els.length<2){ toast("warn","Для группировки выделите рамкой два и более элемента вне виджетов"); return; }
  var gid = "g"+Date.now();
  var names = els.map(function(e){return e.name;});
  els.forEach(function(e){ e.group = gid; });
  var first = els[0];
  S.groups.push({id:gid, name:"Группа · "+names[0], widget:"собрана вручную",
    deviceId:null, page:first.page, parent:first.parent||null, editing:false});
  S.selGroup = gid; S.selEls=[]; S.selEl=null; kit().dirty=true;
  toast("good","Сгруппировано элементов: "+els.length+". Группа перемещается целиком, правка по элементам — кнопкой на рамке.");

function ungroupSelection(){
  if(!S.selGroup) return;
  var gid = S.selGroup;
  var n = S.placed.filter(function(e){return e.group===gid;}).length;
  S.placed.forEach(function(e){ if(e.group===gid) e.group=null; });
  S.groups = S.groups.filter(function(g){ return g.id!==gid; });
  S.selGroup = null; kit().dirty=true;
  toast("info","Виджет разгруппирован: "+n+" элементов остались на холсте");
  rerender();
}

/* ==================================================================
   Холст: настоящие элементы MVP. В правке — макет и настройка,
   в предпросмотре — рабочее поведение по справочнику элементов.

function isPreview(){ return S.canvasMode==="preview"; }
function popupByName(n){ return S.ui.popups.filter(function(p){return p.name===n;})[0]; }
function pageByName(n){ return S.ui.pages.filter(function(p){return p.name===n;})[0]; }
function elsOf(pageId, popupId){
  return S.placed.filter(function(e){
    return popupId ? e.parent===popupId : (e.parent==null && e.page===pageId);
  });
}
function valOf(el){ return el.bind ? S.values[el.bind] : undefined; }
function setValue(el, v, quiet, noRefresh){
  if(!el.bind){ if(!quiet) toast("warn","«"+el.name+"» не связан со значением — команда никуда не отправлена"); return; }
  if(el.dir==="→"){ if(!quiet) toast("warn","Связь «только чтение» — элемент не отправляет значение"); return; }
  S.values[el.bind] = v;
  S.preview.lastSend = el.name+" → "+el.bind+" = "+String(v);
  if(noRefresh) liveUpdate(el); else refreshCanvas();
}
/* точечное обновление во время перетаскивания ползунка: DOM не пересобирается */
function liveUpdate(dragEl){
  var host = document.getElementById("canvasHost"); if(!host) return;
  Array.prototype.forEach.call(host.querySelectorAll('[data-el]'), function(n){
    var el = S.placed.filter(function(x){return x.id===n.getAttribute("data-el");})[0];
    if(!el || !el.bind || el.bind!==dragEl.bind) return;
    if(el.code==="EL-LVL"){
      var vert = pget(el,"orient")==="Вертикальная", r = lvlRatio(el);
      var fill = n.querySelector(".lvl-track>i"), knob = n.querySelector(".lvl-track .knob"),
          val = n.querySelector(".lvl-val");
      if(fill) fill.style[vert?"height":"width"] = (r*100)+"%";
      if(knob) knob.style[vert?"bottom":"left"] = "calc("+(r*100)+"% - 7px)";
      if(val) val.textContent = num(valOf(el), 0) + (pget(el,"scale")==="Логарифмическая"?" dB":"");
    } else if(el.code==="EL-LBL"){
      var t = n.querySelector(".lbl-txt");
      if(t) t.textContent = (pget(el,"text")? pget(el,"text")+": " : "")+fmtValue(el, valOf(el));
    } else if(el.code==="EL-TRG"){
      var on = trgState(el), w = n.querySelector(".w-trg");
      if(w) w.classList.toggle("on", on);
    }
  });
  var st = document.getElementById("canvasStatus");
  if(st) st.textContent = canvasStatusText();
}
function fmtValue(el, v){
  var f = pget(el,"format");
  if(v===undefined || v===null) return "—";
  if(f==="Вкл / Выкл") return (v===true||v===1||v==="1") ? "Вкл" : "Выкл";
  if(f==="Процент") return num(v,0)+" %";
  if(f==="Целое") return String(Math.round(num(v,0)));
  if(f==="Один знак после запятой") return num(v,0).toFixed(1);
  if(typeof v==="boolean") return v? "истина":"ложь";
  return String(v);
}
function trgState(el){
  var v = valOf(el);
  var on = (String(v)===String(pget(el,"val2"))) || v===true || v===1;
  return pget(el,"match")==="Значение 2 → состояние 1 (обратное)" ? !on : on;
}
/* положение ползунка по значению: функция, обратная преобразованию «позиция → значение»,
   поэтому ползунок всегда стоит ровно под курсором мыши, в том числе на логарифмической шкале */
function lvlPos(el, v){
  var mn = num(pget(el,"min"),0), mx = num(pget(el,"max"),100);
  var r = mx===mn ? 0 : (num(v, mn)-mn)/(mx-mn);
  r = Math.max(0, Math.min(1, r));
  if(pget(el,"scale")==="Логарифмическая"){
    var c = Math.max(0.1, num(pget(el,"curve"),2));
    r = Math.pow(r, 1/c);
  }
  return r;
}
function lvlRatio(el){ return lvlPos(el, num(valOf(el), num(pget(el,"min"),0))); }
function notify(text, icon, dur){
  var id = "n"+(++S.preview.seq);
  S.preview.notifs.push({id:id, text:text, icon:icon||"Информация"});
  var def = elDef("EL-NOTIF");
  var maxN = 3;
  if(S.preview.notifs.length>maxN) S.preview.notifs = S.preview.notifs.slice(-maxN);
  refreshCanvas();
  setTimeout(function(){
    S.preview.notifs = S.preview.notifs.filter(function(n){return n.id!==id;});
    refreshCanvas();
  }, dur||3000);
}

/* ---- удержание: порог и повтор (EL-BTN, EL-TRG, EL-UPDN) ---- */
function holdable(node, el, onPress, onHold){
  var t1=null, t2=null, held=false;
  function start(e){
    if(e.button!==undefined && e.button!==0) return;
    held=false; node.classList.add("act");
    t1 = setTimeout(function(){
      held=true; onHold&&onHold();
      t2 = setInterval(function(){ onHold&&onHold(); }, Math.max(80, num(pget(el,"repeat"),250)));
    }, Math.max(150, num(pget(el,"hold"),800)));
  }
  function end(){
    node.classList.remove("act");
    clearTimeout(t1); clearInterval(t2); t1=t2=null;
    if(!held) onPress&&onPress();
    held=false;
  }
  node.addEventListener("pointerdown", start);
  node.addEventListener("pointerup", end);
  node.addEventListener("pointerleave", function(){ if(t1||t2){ node.classList.remove("act"); clearTimeout(t1); clearInterval(t2); t1=t2=null; } });
  return node;
}

/* ---- отрисовка одного элемента ---- */
function renderEl(el, preview){
  var def = elDef(el.code) || {name:el.code, props:[]};
  elProps(el);
  var inner;

  switch(el.code){

  case "EL-LBL": {
    var txt = el.bind ? fmtValue(el, valOf(el)) : pget(el,"text");
    var ic = pget(el,"icon");
    var icoMap = {"Информация":"i","Звук":"♪","Экран":"▭","Свет":"☀"};
    var content = [ ic&&ic!=="Нет" ? h("span",{class:"lbl-ico"},[icoMap[ic]||"·"]) : null,
      h("span",{class:"lbl-txt lbl-"+({"Обрезка с многоточием":"ellipsis","Обрезка":"clip","Перенос по словам":"wrap","Уменьшение шрифта":"shrink"}[pget(el,"overflow")]||"ellipsis")},
        [ el.bind ? (pget(el,"text")? pget(el,"text")+": " : "")+txt : txt ]) ];
    if(pget(el,"iconPos")==="Иконка справа") content.reverse();
    inner = h("div",{class:"w-lbl s-"+({"Крупный":"lg","Мелкий":"sm"}[pget(el,"size")]||"md")
        +" ha-"+({"По центру":"c","По правому краю":"r"}[pget(el,"halign")]||"l")
        +" va-"+({"По верхнему краю":"t","По нижнему краю":"b"}[pget(el,"valign")]||"c")
        +(pget(el,"iconPos")==="Иконка сверху"?" col":"")}, content);
    break;
  }

  case "EL-BTN": {
    var pressed = el._st;
    inner = h("div",{class:"w-btn"+(pressed?" on":"")},[
      h("span",{class:"cap"},[pget(el,"caption")]),
      preview? null : h("span",{class:"sub"},[pget(el,"action")==="Отправить значение"? "→ "+pget(el,"send") : pget(el,"action")])
    ]);
    if(preview){
      holdable(inner, el, function(){ btnPress(el); }, function(){ btnHold(el); });
    }
    break;
  }

  case "EL-TRG": {
    var on = trgState(el);
    inner = h("div",{class:"w-trg"+(on?" on":"")},[
      h("span",{class:"knob"}),
      h("span",{class:"cap"},[on? pget(el,"cap2") : pget(el,"cap1")])
    ]);
    if(preview) holdable(inner, el, function(){ trgPress(el); }, function(){ toast("info","Удержание «"+el.name+"» — событие повторяется каждые "+pget(el,"repeat")+" мс"); });
    break;
  }

  case "EL-LVL": {
    var vert = pget(el,"orient")==="Вертикальная";
    var r = lvlRatio(el);
    var fill = h("i",{style: vert? "height:"+(r*100)+"%" : "width:"+(r*100)+"%"});
