/* ==================================================================
   Умные направляющие: выравнивание по краям и центрам соседних
   элементов с прилипанием, плюс подписи расстояний до ближайших.
   ================================================================== */
function snap(v){ return Math.round(v/10)*10; }
function siblingsOf(moving){
  var ids = {}; moving.forEach(function(e){ ids[e.id]=1; });
  var first = moving[0]; if(!first) return [];
  return S.placed.filter(function(e){
    return !ids[e.id] && e.page===first.page && (e.parent||null)===(first.parent||null);
  });
}
function bboxOf(list){
  var x1=Math.min.apply(null,list.map(function(e){return e.x;}));
  var y1=Math.min.apply(null,list.map(function(e){return e.y;}));
  var x2=Math.max.apply(null,list.map(function(e){return e.x+e.w;}));
  var y2=Math.max.apply(null,list.map(function(e){return e.y+e.h;}));
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
/* подбирает поправку к позиции, чтобы прилипнуть к краю или центру соседа */
function computeGuides(box, sibs){
  var tol = Math.max(4, 7/S.ui.zoom);
  var res = {dx:0, dy:0, v:[], hLines:[]};
  var vCands = [
    {mine:box.x, key:"left"}, {mine:box.x+box.w/2, key:"cx"}, {mine:box.x+box.w, key:"right"}
  ];
  var hCands = [
    {mine:box.y, key:"top"}, {mine:box.y+box.h/2, key:"cy"}, {mine:box.y+box.h, key:"bottom"}
  ];
  var bestV=null, bestH=null;
  sibs.forEach(function(s){
    [s.x, s.x+s.w/2, s.x+s.w].forEach(function(sv){
      vCands.forEach(function(c){
        var d = sv - c.mine;
        if(Math.abs(d)<=tol && (!bestV || Math.abs(d)<Math.abs(bestV.d))) bestV = {d:d, pos:sv, s:s};
      });
    });
    [s.y, s.y+s.h/2, s.y+s.h].forEach(function(sh){
      hCands.forEach(function(c){
        var d = sh - c.mine;
        if(Math.abs(d)<=tol && (!bestH || Math.abs(d)<Math.abs(bestH.d))) bestH = {d:d, pos:sh, s:s};
      });
    });
  });
  /* края рабочей области тоже притягивают */
  [0, S.ui.size.w/2, S.ui.size.w].forEach(function(fv){
    vCands.forEach(function(c){
      var d = fv - c.mine;
      if(Math.abs(d)<=tol && (!bestV || Math.abs(d)<Math.abs(bestV.d))) bestV = {d:d, pos:fv, frame:true};
    });
  });
  [0, S.ui.size.h/2, S.ui.size.h].forEach(function(fh){
    hCands.forEach(function(c){
      var d = fh - c.mine;
      if(Math.abs(d)<=tol && (!bestH || Math.abs(d)<Math.abs(bestH.d))) bestH = {d:d, pos:fh, frame:true};
    });
  });
  if(bestV){ res.dx = bestV.d; res.v.push(bestV); }
  if(bestH){ res.dy = bestH.d; res.hLines.push(bestH); }
  return res;
}
/* ближайшие соседи по горизонтали и вертикали — для подписи расстояния */
function nearestGaps(box, sibs){
  var gaps = [], left=null, right=null, up=null, down=null;
  sibs.forEach(function(s){
    var vOverlap = !(s.y+s.h < box.y || s.y > box.y+box.h);
    var hOverlap = !(s.x+s.w < box.x || s.x > box.x+box.w);
    if(vOverlap){
      if(s.x+s.w <= box.x){ var d = box.x-(s.x+s.w); if(!left || d<left.d) left={d:d, s:s}; }
      if(s.x >= box.x+box.w){ var d2 = s.x-(box.x+box.w); if(!right || d2<right.d) right={d:d2, s:s}; }
    }
    if(hOverlap){
      if(s.y+s.h <= box.y){ var d3 = box.y-(s.y+s.h); if(!up || d3<up.d) up={d:d3, s:s}; }
      if(s.y >= box.y+box.h){ var d4 = s.y-(box.y+box.h); if(!down || d4<down.d) down={d:d4, s:s}; }
    }
  });
  var cy = box.y+box.h/2, cx = box.x+box.w/2;
  if(left) gaps.push({axis:"x", from:left.s.x+left.s.w, to:box.x, at:cy, val:Math.round(left.d)});
  if(right) gaps.push({axis:"x", from:box.x+box.w, to:right.s.x, at:cy, val:Math.round(right.d)});
  if(up) gaps.push({axis:"y", from:up.s.y+up.s.h, to:box.y, at:cx, val:Math.round(up.d)});
  if(down) gaps.push({axis:"y", from:box.y+box.h, to:down.s.y, at:cx, val:Math.round(down.d)});
  return gaps;
}
function guideLayer(){
  var host = document.getElementById("canvasHost");
  if(!host) return null;
  var g = host.querySelector(".guides");
  if(!g){ g = h("div",{class:"guides"}); host.appendChild(g); }
  return g;
}
function drawGuides(res, box, gaps){
  var g = guideLayer(); if(!g) return;
  g.innerHTML = "";
  var z = S.ui.zoom, px = S.ui.pan.x, py = S.ui.pan.y;
  function sx(v){ return px + v*z; }
  function sy(v){ return py + v*z; }
  res.v.forEach(function(v){
    g.appendChild(h("div",{class:"guide v"+(v.frame?" frame":""), style:"left:"+sx(v.pos)+"px;"}));
  });
  res.hLines.forEach(function(v){
    g.appendChild(h("div",{class:"guide h"+(v.frame?" frame":""), style:"top:"+sy(v.pos)+"px;"}));
  });
  (gaps||[]).forEach(function(gp){
    if(gp.val<=0) return;
    if(gp.axis==="x"){
      g.appendChild(h("div",{class:"dim x", style:"left:"+sx(gp.from)+"px;top:"+sy(gp.at)+"px;width:"+((gp.to-gp.from)*z)+"px;"},
        [h("span",{class:"dim-val"},[gp.val+""])]));
    } else {
      g.appendChild(h("div",{class:"dim y", style:"left:"+sx(gp.at)+"px;top:"+sy(gp.from)+"px;height:"+((gp.to-gp.from)*z)+"px;"},
        [h("span",{class:"dim-val"},[gp.val+""])]));
    }
  });
}
function clearGuides(){
  var g = document.querySelector(".guides");
  if(g) g.innerHTML = "";
}
function applySmartMove(movingEls, rawX, rawY, anchor){
  /* rawX/rawY — желаемая позиция якорного элемента (или bbox) без прилипания */
  var box = bboxOf(movingEls);
  var offX = rawX - anchor.x, offY = rawY - anchor.y;
  var probe = {x:box.x+offX, y:box.y+offY, w:box.w, h:box.h};
  var sibs = siblingsOf(movingEls);
  var res = computeGuides(probe, sibs);
  probe.x += res.dx; probe.y += res.dy;
  var dx = probe.x - box.x, dy = probe.y - box.y;
  movingEls.forEach(function(e){ e.x = Math.round(e.x + dx); e.y = Math.round(e.y + dy); });
  drawGuides(res, probe, nearestGaps(probe, sibs));
  return probe;
}
function selectedEls(){
  return S.placed.filter(function(e){ return (S.selEls||[]).indexOf(e.id)>=0; });
}
function elPointerDown(e, el){
  if(e.button!==0 || S.ui.tool!=="arrow") return;
  if(e.target.closest && e.target.closest(".el-tag")) return;
  var multi = (S.selEls||[]).indexOf(el.id)>=0 && S.selEls.length>1;
  if(!multi){
    if(e.shiftKey){
      S.selEls = (S.selEls||[]).concat([el.id]);
      S.selEl = el.id; S.selGroup=null; S.selNode=null; rerender(); return;
    }
    S.selEls = [el.id];
  }
  var moving = multi? selectedEls() : [el];
  S.selEl = el.id; S.selGroup=null; S.selNode=null;
  var sx=e.clientX, sy=e.clientY, ox=el.x, oy=el.y, moved=false;
  var host = document.getElementById("canvasHost");
  var node = e.currentTarget;
  node.setPointerCapture(e.pointerId);
  function mv(ev){
    var dx=(ev.clientX-sx)/S.ui.zoom, dy=(ev.clientY-sy)/S.ui.zoom;
    if(!moved && Math.abs(dx)<3 && Math.abs(dy)<3) return;
    moved=true; node.classList.add("moving");
    var probe = applySmartMove(moving, snap(ox+dx), snap(oy+dy), {x:el.x, y:el.y});
    if(host) moving.forEach(function(m){
      var n = host.querySelector('[data-el="'+m.id+'"]');
      if(n){ n.style.left=m.x+"px"; n.style.top=m.y+"px"; }
    });
    setCanvasHint(moving.length>1
      ? moving.length+" элементов · "+Math.round(probe.x)+", "+Math.round(probe.y)
      : "«"+el.name+"» · "+el.x+", "+el.y+(insideFrame(el)?"":" · за пределами рабочей области"));
  }
  function up(){
    node.removeEventListener("pointermove", mv); node.removeEventListener("pointerup", up);
    node.classList.remove("moving"); setCanvasHint(null); clearGuides();
    if(moved) kit().dirty=true;
    rerender();
  }
  node.addEventListener("pointermove", mv); node.addEventListener("pointerup", up);
}
function groupPointerDown(e, grp){
  if(e.button!==0 || S.ui.tool!=="arrow") return;
  var els = S.placed.filter(function(x){return x.group===grp.id;});
  if(!els.length) return;
  var anchor = {x:els[0].x, y:els[0].y};
  var sx=e.clientX, sy=e.clientY, ox=anchor.x, oy=anchor.y, moved=false;
  S.selGroup=grp.id; S.selEl=null; S.selNode=null; S.selEls=[];
  var host = document.getElementById("canvasHost");
  var node = e.currentTarget;
  node.setPointerCapture(e.pointerId);
  function mv(ev){
    var dx=(ev.clientX-sx)/S.ui.zoom, dy=(ev.clientY-sy)/S.ui.zoom;
    if(!moved && Math.abs(dx)<3 && Math.abs(dy)<3) return;
    moved=true;
    var probe = applySmartMove(els, snap(ox+dx), snap(oy+dy), {x:els[0].x, y:els[0].y});
    if(host){
      els.forEach(function(m){
        var n = host.querySelector('[data-el="'+m.id+'"]');
        if(n){ n.style.left=m.x+"px"; n.style.top=m.y+"px"; }
      });
      var gb = host.querySelector('[data-grp="'+grp.id+'"]');
      if(gb){ gb.style.left=(probe.x-8)+"px"; gb.style.top=(probe.y-22)+"px"; }
    }
    setCanvasHint("Виджет «"+grp.name+"» · "+Math.round(probe.x)+", "+Math.round(probe.y)+(boxInsideFrame(probe)?"":" · за пределами рабочей области"));
  }
  function up(){
    node.removeEventListener("pointermove", mv); node.removeEventListener("pointerup", up);
    setCanvasHint(null); clearGuides();
    if(moved) kit().dirty=true;
    rerender();
  }
  node.addEventListener("pointermove", mv); node.addEventListener("pointerup", up);
}
function groupBox(grp){
  var els = S.placed.filter(function(x){return x.group===grp.id;});
  if(!els.length) return {x:0,y:0,w:0,h:0};
  var x1=Math.min.apply(null, els.map(function(e){return e.x;}));
  var y1=Math.min.apply(null, els.map(function(e){return e.y;}));
  var x2=Math.max.apply(null, els.map(function(e){return e.x+e.w;}));
  var y2=Math.max.apply(null, els.map(function(e){return e.y+e.h;}));
  return {x:x1, y:y1, w:x2-x1, h:y2-y1};
}
function insideFrame(el){
  return el.x>=0 && el.y>=0 && (el.x+el.w)<=S.ui.size.w && (el.y+el.h)<=S.ui.size.h;
}
function boxInsideFrame(bb){
  return bb.x>=0 && bb.y>=0 && (bb.x+bb.w)<=S.ui.size.w && (bb.y+bb.h)<=S.ui.size.h;
}
function setCanvasHint(text){
  var n = document.getElementById("canvasHint");
  if(!n) return;
  n.textContent = text || "";
  n.hidden = !text;
}

/* ---- поведение элементов в предпросмотре ---- */
function btnPress(el){
  var rule = pget(el,"rule");
  if(rule==="По воздействию пользователя"){ el._st = true; setTimeout(function(){ el._st=false; refreshCanvas(); }, 140); }
  else if(rule!=="Не меняется"){ el._st = !el._st; }
  var act = pget(el,"action"), target = pget(el,"target");
  if(act==="Перейти на страницу"){
    var pg = pageByName(target) || S.ui.pages.filter(function(p){return p.id!==S.ui.activePage;})[0];
    if(pg){ S.ui.activePage = pg.id; toast("info","Переход на страницу «"+pg.name+"»"); }
  } else if(act==="Открыть всплывающее окно"){
    var pp = popupByName(target) || S.ui.popups[0];
    if(pp) S.ui.openPopup = pp.id;
  } else if(act==="Закрыть всплывающее окно"){
    S.ui.openPopup = null;
  } else if(act==="Показать уведомление"){
    notify(target || "Событие выполнено", "Информация", 3000);
  } else {
    var v = pget(el,"vtype")==="Логический" ? true : (pget(el,"vtype")==="Строка"? pget(el,"send") : num(pget(el,"send"),1));
    setValue(el, v, true);
  }
  refreshCanvas();
}
function btnHold(el){

}
function trgPress(el){
  var on = trgState(el);
  var nv = on ? pget(el,"val1") : pget(el,"val2");
  var typed = pget(el,"vtype")==="Логический" ? (String(nv)===String(pget(el,"val2"))) : (pget(el,"vtype")==="Строка"? nv : num(nv,0));
  if(pget(el,"source")==="Действие пользователя" && !el.bind){
    el._local = !el._local; toast("info","Источник смены состояния — действие пользователя: элемент переключился, команда не ушла (связи нет)");
    refreshCanvas(); return;
  }
  setValue(el, typed, true);

function updnStep(el, isHold){
  if(!el.bind){ toast("warn","«"+el.name+"» не связан со значением"); return; }
  var up = pget(el,"dirn")==="Увеличение";
  var step = Math.abs(num(pget(el, isHold?"stepHold":"step"), 1)) * (up?1:-1);
  var cur = valOf(el); if(cur===undefined || cur===null) cur = num(pget(el,"def"),0);
  var next = num(cur,0) + step;
  var lim = num(pget(el,"limit"), up?100:0);
  if((up && next>lim) || (!up && next<lim)){
    toast("warn","Предел "+lim+" — значение не изменяется и не отправляется");
    return;
  }
  setValue(el, next, true);

function lvlDrag(track, el, vert, host){
  var tile = host || track.parentNode;
  function valAt(e){
    var r = track.getBoundingClientRect();
    var ratio = vert ? 1-(e.clientY-r.top)/r.height : (e.clientX-r.left)/r.width;
    ratio = Math.max(0, Math.min(1, ratio));       /* курсор уровня не выходит за активную область */
    var mn = num(pget(el,"min"),0), mx = num(pget(el,"max"),100), st = Math.max(0.001, num(pget(el,"step"),1));
    if(pget(el,"scale")==="Логарифмическая"){ ratio = Math.pow(ratio, num(pget(el,"curve"),2)); }
    var v = mn + Math.round((mx-mn)*ratio/st)*st;
    v = Math.max(Math.min(mn,mx), Math.min(Math.max(mn,mx), Math.round(v*100)/100));
    return v;
  }
  /* отрисовка без записи значения — для режима «отправка по завершении движения»:
     ползунок всё равно идёт за мышью, наружу уходит только итоговое значение */
  function paint(v){
    var r = lvlPos(el, v);
    var fill = track.querySelector("i"), knob = track.querySelector(".knob");
    if(fill) fill.style[vert?"height":"width"] = (r*100)+"%";
    if(knob) knob.style[vert?"bottom":"left"] = "calc("+(r*100)+"% - 7px)";
    var lab = tile? tile.querySelector(".lvl-val") : null;
    if(lab) lab.textContent = v + (pget(el,"scale")==="Логарифмическая"?" dB":"");
  }
  function apply(e, commit){
    var v = valAt(e);
    if(pget(el,"send")==="По завершении движения" && !commit){ el._drag = v; paint(v); return; }
    el._drag = null;
    setValue(el, v, true, !commit);
  }
  track.addEventListener("pointerdown", function(e){
    if(e.button!==0) return;                        /* тянем только левой кнопкой */
    if(pget(el,"source")==="Обратная связь"){ toast("info","Источник смены значения — обратная связь: ползунок ведомый"); return; }
    e.preventDefault(); e.stopPropagation();
    try{ track.setPointerCapture(e.pointerId); }catch(err){}
    if(tile) tile.classList.add("dragging-lvl");
    apply(e, false);                                /* клик по полосе — ползунок встаёт в точку клика */
    function move(ev){ apply(ev, false); }          /* ЛКМ зажата — ползунок идёт за мышью */
    function stop(ev){
      track.removeEventListener("pointermove", move);
      track.removeEventListener("pointerup", stop);
      track.removeEventListener("pointercancel", stop);
      if(tile) tile.classList.remove("dragging-lvl");
      apply(ev, true);                              /* отпустили — ползунок остаётся там, где остановились */
    }
    track.addEventListener("pointermove", move);
    track.addEventListener("pointerup", stop);
    track.addEventListener("pointercancel", stop);
  });
}
function joyDrag(field, el){
  if(!field) return;
  function apply(e){
    var r = field.getBoundingClientRect();
    var rng = num(pget(el,"range"),100);
    var x = ((e.clientX-r.left)/r.width*2-1)*rng;
    var y = (1-(e.clientY-r.top)/r.height*2)*rng;
    if(pget(el,"axes")==="Одна ось") y = 0;
    el._joy = {x:Math.max(-rng,Math.min(rng,x)), y:Math.max(-rng,Math.min(rng,y))};
    if(pget(el,"send")==="Непрерывно при движении") setValue(el, Math.round(el._joy.x), true, true);
    var kn = field.querySelector(".joy-knob"), vv = field.parentNode.querySelector(".joy-val");
    if(kn){ kn.style.left = "calc(50% + "+(el._joy.x*0.38)+"%)"; kn.style.top = "calc(50% - "+(el._joy.y*0.38)+"%)"; }
    if(vv) vv.textContent = "pan "+Math.round(el._joy.x)+" · tilt "+Math.round(el._joy.y);
  }
  field.addEventListener("pointerdown", function(e){
    field.setPointerCapture(e.pointerId); apply(e);
    function move(ev){ apply(ev); }
    function up(ev){
      field.removeEventListener("pointermove", move); field.removeEventListener("pointerup", up);
      if(pget(el,"send")==="По завершении движения") setValue(el, Math.round((el._joy||{x:0}).x), true);
      if(pget(el,"center")==="Включён"){ el._joy = {x:0,y:0}; }

    }
    field.addEventListener("pointermove", move); field.addEventListener("pointerup", up);
  });
}

/* выделение рамкой: элементы вне виджетов */
function rubberStart(e, vp){
  var r0 = vp.getBoundingClientRect();
  var x0 = e.clientX-r0.left, y0 = e.clientY-r0.top, moved=false;
  var band = h("div",{class:"rubber", style:"left:"+x0+"px;top:"+y0+"px;width:0;height:0;"});
  vp.appendChild(band);
  vp.setPointerCapture(e.pointerId);
  function mv(ev){
    var x = ev.clientX-r0.left, y = ev.clientY-r0.top;
    if(!moved && Math.abs(x-x0)<4 && Math.abs(y-y0)<4) return;
    moved = true;
    band.style.left = Math.min(x,x0)+"px"; band.style.top = Math.min(y,y0)+"px";
    band.style.width = Math.abs(x-x0)+"px"; band.style.height = Math.abs(y-y0)+"px";
  }
  function up(ev){
    vp.removeEventListener("pointermove", mv); vp.removeEventListener("pointerup", up);
    var x = ev.clientX-r0.left, y = ev.clientY-r0.top;
    band.remove();
    if(!moved){ S.selEl=null; S.selGroup=null; S.selEls=[]; rerender(); return; }
    var wx1 = (Math.min(x,x0)-S.ui.pan.x)/S.ui.zoom, wy1 = (Math.min(y,y0)-S.ui.pan.y)/S.ui.zoom;
    var wx2 = (Math.max(x,x0)-S.ui.pan.x)/S.ui.zoom, wy2 = (Math.max(y,y0)-S.ui.pan.y)/S.ui.zoom;
    var et = editTarget();
    var parentId = et.type==="popup"? et.id : null;
    var hit = S.placed.filter(function(el){
      if(el.page!==S.ui.activePage || (el.parent||null)!==parentId) return false;
      if(el.group){
        var g = S.groups.filter(function(x){return x.id===el.group;})[0];
        if(g && !g.editing) return false;   /* элементы виджета выделяются только в режиме поэлементной правки */
      }
      return !(el.x+el.w < wx1 || el.x > wx2 || el.y+el.h < wy1 || el.y > wy2);
    });
    S.selEls = hit.map(function(el){return el.id;});
    S.selEl = hit.length===1? hit[0].id : null;
    S.selGroup = null; S.selNode = null;
    if(hit.length) toast("info","Выделено элементов: "+hit.length+(hit.length>1? " — их можно сгруппировать" : ""));
    rerender();
  }
  vp.addEventListener("pointermove", mv); vp.addEventListener("pointerup", up);
}

function rowKind(r){
  if(r.custom) return r.kind || "";

function rowModel(r){ return r.custom? null : modelByName(r.vendor, r.model); }
function rowTags(r){ var m = rowModel(r); return m? m.tags : 4; }

function wizTotals(){

/* ==================================================================
   Виджет = готовый набор элементов: добавляется группой, с сохранением
   взаимного положения и связей с тегами. После добавления элементы
   редактируются свободно, а группа перемещается целиком.
   ================================================================== */
function freeSpot(w, hgt, pageId, parentId){
  var step = 10;
  for(var y=0; y+hgt<=S.ui.size.h; y+=step*2){
    for(var x=0; x+w<=S.ui.size.w; x+=step*2){
      var busy = S.placed.some(function(e){
        if(e.page!==pageId || (e.parent||null)!==(parentId||null)) return false;
        return !(e.x+e.w<=x || e.x>=x+w || e.y+e.h<=y || e.y>=y+hgt);
      });
      if(!busy) return {x:x, y:y, inside:true};
    }
  }
  /* не помещается в рабочую область — кладём справа от неё */
  var outY = 0;
  S.placed.filter(function(e){ return e.page===pageId && e.x>=S.ui.size.w; })
    .forEach(function(e){ outY = Math.max(outY, e.y+e.h+20); });
  return {x:S.ui.size.w+60, y:outY, inside:false};
}
function placeWidgetFor(d, widgetName){
  var name = widgetName && WIDGETS[widgetName] ? widgetName : widgetsFor(d.kind)[0];
  var tpl = WIDGETS[name];
  if(!tpl){
    var first = d.tags[0];
    var spot0 = freeSpot(cellW(2), cellH(1), S.ui.activePage, null);
    S.placed.push({id:"e"+Date.now(), code:"EL-LBL", page:S.ui.activePage, parent:null,
      x:spot0.x, y:spot0.y, w:cellW(2), h:cellH(1), name:d.name, bind:first? first.name : null,
      dir:first?"→":undefined, p:{text:d.name}});
    return {inside:spot0.inside, name:d.name};
  }
  var W = cellX(tpl.cols-1)+cellW(1), H = cellY(tpl.rows-1)+cellH(1);
  var et = (typeof editTarget==="function") ? editTarget() : {type:"page"};
  var parentId = et.type==="popup" ? et.id : null;
  var spot = freeSpot(W, H, S.ui.activePage, parentId);
  var gid = "g"+Date.now()+Math.floor(Math.random()*99);
  var prefix = d.tags.length && d.tags[0].name.indexOf(".")>0 ? d.tags[0].name.split(".")[0] : d.id;
  var bySuffix = {};
  d.tags.forEach(function(tg){ bySuffix[tg.name.split(".").slice(1).join(".")] = tg; });
  var base = Date.now(), n = 0, missing = [];
  tpl.els.forEach(function(t){
    var tag = t.t ? bySuffix[t.t] : null;
    if(t.t && !tag) missing.push(t.t);
    if(tag) tag.uses++;
    var el = {id:"e"+(base+(n++)), code:t.c, page:S.ui.activePage, parent:parentId, group:gid,
      x:spot.x+cellX(t.x), y:spot.y+cellY(t.y), w:cellW(t.w), h:cellH(t.h),
      name:t.n, bind: tag? tag.name : null, dir: tag? "⇄" : undefined, p: JSON.parse(JSON.stringify(t.p||{}))};
    elProps(el);
    S.placed.push(el);
  });
  S.groups.push({id:gid, name:d.name, widget:name, deviceId:d.id, page:S.ui.activePage,
    parent:parentId, editing:false});
  S.selGroup = gid; S.selEl = null;
  return {inside:spot.inside, name:name, missing:missing, group:gid, w:W, h:H};
}

  ]), actions:[ btn("Открыть сохранённую версию","ghost", function(){ closeModal(); toast("info","Открыта версия от 10:12"); }),
    btn("Восстановить из копии","primary", function(){ closeModal(); toast("good","Работа восстановлена из промежуточной копии"); }) ]});
}
/* ============================ ROUTER ============================ */
var ROUTES = {
  "#/map": screenMap,
  "#/start": screenStart,
  "#/acc01/time": acc01Time, "#/acc01/logging": acc01Logging, "#/acc01/network": acc01Network,
  "#/acc01/ip": acc01Ip, "#/acc01/done": acc01Done,
  "#/acc02/source": acc02Source, "#/acc02/verify": acc02Verify, "#/acc02/bad": acc02Bad,
  "#/acc02/network": acc02Network, "#/acc02/run": acc02Run, "#/acc02/login": acc02Login, "#/acc02/result": acc02Result,
  "#/scl01/source": sclSource, "#/scl01/login": sclLogin, "#/scl01/denied": sclDenied,
  "#/scl01/time": sclTime, "#/scl01/ip": sclIp,
  "#/scl01/data": sclData, "#/scl01/clients": sclClients, "#/scl01/done": sclDone,
  "#/dashboard": screenDashboard, "#/logs": screenLogs, "#/sys": screenSys,
  "#/kits": screenKits, "#/cfg": screenCfg,
  "#/kitw/devices": kitwDevices, "#/kitw/style": kitwStyle, "#/kitw/scenarios": kitwScenarios,
  "#/kitw/review": kitwReview, "#/kitw/result": kitwResult
};
/* Ссылки вида #/cfg/<панель> открывают тот же экран с нужной панелью дока */
var CFG_PANELS = {kit:1, wizard:1, library:1, links:1, media:1, scripts:1, persist:1, hygiene:1, deploy:1};
var NEEDS_LOGIN = {"#/dashboard":1,"#/logs":1,"#/sys":1,"#/kits":1,"#/cfg":1,
  "#/kitw/devices":1,"#/kitw/style":1,"#/kitw/scenarios":1,"#/kitw/review":1,"#/kitw/result":1};

function rerender(){
  closeCtx();
  var hash = location.hash || "#/start";
  if(hash.indexOf("#/cfg")===0){
    var part = hash.split("/")[2];
    if(part==="preview"){ S.canvasMode="preview"; }
    else if(part && CFG_PANELS[part]){ S.panel=part; S.dockOpen=true; }
    hash = "#/cfg";
  }
  if(NEEDS_LOGIN[hash] && !S.loggedIn) S.loggedIn = true;
  if(hash==="#/cfg"){
    if(!S.openKits.length){ S.openKits=["k1"]; S.activeKit="k1"; }
    var K = kit();
    if(!S.activeMember || !K.members.some(function(m){return m.id===S.activeMember;}))
      S.activeMember = K.members.length ? K.members[0].id : null;
  }
  var render = ROUTES[hash] || screenMap;
  var main = document.getElementById("main");
  main.innerHTML = "";
  main.appendChild(render());
  renderSidebar();
}
window.addEventListener("hashchange", rerender);

/* ============================ INIT ============================ */
(function init(){
  try { S.collapsed = store("av.sb")==="1"; } catch(e){}
  if(!location.hash) location.hash = "#/start";
  rerender();
})();

})();
</script>
